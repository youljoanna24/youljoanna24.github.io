<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무제_MUZE - 글쓰기 & 발췌 아카이브</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosepink: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gowun+Batang&family=Gowun+Dodum&family=Maru+Buri&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Gowun Batang', serif;
            background-color: #fff5f6;
            color: #4a3e3e;
        }
        .font-batang { font-family: 'Gowun Batang', serif; }
        .font-dodum { font-family: 'Gowun Dodum', sans-serif; }
        .font-myeongjo { font-family: 'Nanum Myeongjo', serif; }
        .font-maruburi { font-family: 'Maru Buri', serif; }
        .font-pen { font-family: 'Nanum Pen Script', cursive; }
        .font-dongle { font-family: 'Dongle', sans-serif; }
        .font-noto { font-family: 'Noto Sans KR', sans-serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff0f3;
        }
        ::-webkit-scrollbar-thumb {
            background: #fca5a5;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f87171;
        }

        /* Editor content styling */
        #editorContent[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: #dda0a0;
            pointer-events: none;
            display: block;
        }

        /* Printable A4 Canvas Styling */
        .a4-page {
            width: 210mm;
            padding: 20mm;
            margin: auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.08);
            box-sizing: border-box;
            position: relative;
        }

        /* Export Capture Canvas */
        #captureTarget {
            width: 210mm;
            min-height: 297mm;
            height: auto !important;
            padding: 20mm;
            background: #ffffff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .export-text-body {
            line-height: 1.85 !important;
            letter-spacing: normal !important;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        /* Offscreen Render Box */
        .offscreen-render {
            position: fixed !important;
            left: -9999px !important;
            top: 0 !important;
            z-index: -1000 !important;
            opacity: 1 !important;
            visibility: visible !important;
            display: block !important;
        }

        /* Excerpt Card Capture Box */
        .excerpt-card-box {
            width: 500px;
            padding: 40px;
            background: #fffdfd;
            border: 1px solid #fecdd3;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.05);
            position: relative;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-rose-50/50">

    <!-- App Header -->
    <header class="h-14 bg-white/80 backdrop-blur border-b border-rose-100 flex items-center justify-between px-6 z-20">
        <div class="flex items-center gap-3">
            <span class="text-rose-500 text-lg font-bold tracking-wider font-dodum">무제_MUZE</span>
            <span class="text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full font-dodum">집필 & 발췌 노트</span>
        </div>
        <div class="flex items-center gap-3">
            <!-- Timer Display & Control -->
            <div class="flex items-center gap-2 bg-rose-50 px-3 py-1.5 rounded-full border border-rose-200 text-xs text-rose-700">
                <i class="fa-regular fa-clock text-rose-500"></i>
                <span id="timerDisplay" class="font-mono font-medium">00:00:00</span>
                <button id="toggleTimerBtn" onclick="toggleTimer()" title="시간 체크 일시정지/재개" class="ml-1 w-5 h-5 flex items-center justify-center rounded-full bg-rose-200 hover:bg-rose-300 text-rose-800 transition text-[10px]">
                    <i class="fa-solid fa-pause" id="timerIcon"></i>
                </button>
            </div>
            
            <button onclick="openExportModal()" class="flex items-center gap-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs px-3.5 py-1.5 rounded-lg transition shadow-sm font-dodum">
                <i class="fa-solid fa-download"></i>
                <span>저장 / 내보내기</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white/60 border-r border-rose-100 flex flex-col flex-shrink-0">
            <div class="p-3 border-b border-rose-100 flex bg-rose-50/50">
                <button onclick="switchTab('notes')" id="tabNotesBtn" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition font-dodum bg-white text-rose-600 shadow-sm">집필 노트</button>
                <button onclick="switchTab('excerpts')" id="tabExcerptsBtn" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition font-dodum text-gray-500 hover:text-rose-600">발췌 카드</button>
            </div>
            
            <div id="notesSection" class="flex-1 flex flex-col overflow-hidden">
                <div class="p-3 border-b border-rose-100 flex justify-between items-center">
                    <span class="text-xs font-bold text-rose-800 font-dodum tracking-wider">목차</span>
                    <button onclick="createNewPage()" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 px-2.5 py-1 rounded-md transition flex items-center gap-1 font-dodum">
                        <i class="fa-solid fa-plus text-[10px]"></i> 새 노트
                    </button>
                </div>
                <div id="pagesList" class="flex-1 overflow-y-auto p-2 space-y-1">
                    <!-- Pages dynamic rendering -->
                </div>
            </div>

            <div id="excerptsSection" class="flex-1 flex flex-col overflow-hidden hidden">
                <div class="p-3 border-b border-rose-100">
                    <span class="text-xs font-bold text-rose-800 font-dodum tracking-wider">발췌 아카이브</span>
                </div>
                <div id="excerptsList" class="flex-1 overflow-y-auto p-2 space-y-2">
                    <!-- Excerpt cards list -->
                </div>
            </div>

            <div class="p-3 border-t border-rose-100 bg-white/40 text-center">
                <span class="text-[11px] text-rose-400 font-dodum">무제_MUZE</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col bg-white/30 overflow-hidden">
            
            <!-- Editor Formatting Toolbar -->
            <div class="h-12 border-b border-rose-100 bg-white/80 px-4 flex items-center justify-between gap-2 overflow-x-auto">
                <div class="flex items-center gap-1">
                    <!-- Font selector -->
                    <select id="fontSelect" onchange="changeFont(this.value)" class="text-xs border border-rose-200 rounded px-2 py-1 bg-white text-rose-900 focus:outline-none focus:border-rose-400">
                        <option value="font-batang">바탕체 (Gowun Batang)</option>
                        <option value="font-dodum">돋움체 (Gowun Dodum)</option>
                        <option value="font-myeongjo">명조체 (Nanum Myeongjo)</option>
                        <option value="font-maruburi">마루부리체 (Maru Buri)</option>
                        <option value="font-pen">손글씨 (Nanum Pen)</option>
                        <option value="font-dongle">동글체 (Dongle)</option>
                        <option value="font-noto">고딕체 (Noto Sans)</option>
                    </select>

                    <div class="h-4 w-[1px] bg-rose-200 mx-1"></div>

                    <!-- Text Styles -->
                    <button onclick="execCommand('bold')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="굵게"><i class="fa-solid fa-bold"></i></button>
                    <button onclick="execCommand('italic')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="기울임꼴"><i class="fa-solid fa-italic"></i></button>
                    <button onclick="execCommand('underline')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="밑줄"><i class="fa-solid fa-underline"></i></button>
                    <button onclick="execCommand('strikeThrough')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="취소선"><i class="fa-solid fa-strikethrough"></i></button>

                    <div class="h-4 w-[1px] bg-rose-200 mx-1"></div>

                    <!-- Alignment -->
                    <button onclick="execCommand('justifyLeft')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="왼쪽 정렬"><i class="fa-solid fa-align-left"></i></button>
                    <button onclick="execCommand('justifyCenter')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="중앙 정렬"><i class="fa-solid fa-align-center"></i></button>
                    <button onclick="execCommand('justifyRight')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="오른쪽 정렬"><i class="fa-solid fa-align-right"></i></button>

                    <div class="h-4 w-[1px] bg-rose-200 mx-1"></div>

                    <!-- Excerpt tool button -->
                    <button onclick="createExcerptFromSelection()" class="text-xs bg-rose-100 hover:bg-
