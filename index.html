<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무제_MUZE - 글쓰기 및 발췌 아카이브</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2canvas for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- html2pdf for Direct PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Web Fonts -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Maru+Buri:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff0f3',
                            100: '#ffe3e8',
                            200: '#fccad3',
                            300: '#f89eb1',
                            400: '#f36886',
                            500: '#e83e65',
                            600: '#d3204c',
                            700: '#b1143a',
                            800: '#931434',
                            900: '#7d1530',
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                        batang: ['Gowun Batang', 'serif'],
                        myeongjo: ['Nanum Myeongjo', 'serif'],
                        maruburi: ['Maru Buri', 'serif'],
                        dodum: ['Gowun Dodum', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #fff8f9;
        }
        /* Custom Pink Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(243, 104, 134, 0.05);
        }
        ::-webkit-scrollbar-thumb {

        }
        ::-webkit-scrollbar-thumb:hover {

    </header>

    <!-- Main Workspace -->

            <!-- New Note Button & Search -->

                    <span>새 집필 노트</span>

            <!-- Tab Navigation -->

            <div class="flex gap-2">

                    <span>아카이브에 저장</span>

    <!-- App Logic -->
    <script>
        // State Management
        let state = {
            notes: [],
            excerpts: [],
            activeNoteId: null,
            activeTab: 'notes',
            timerSeconds: 0,
            isTimerActive: false,
            idleTimer: null
        };

        // DOM Elements
        const notesListContainer = document.getElementById('notes-list-container');
        const excerptsListContainer = document.getElementById('excerpts-list-container');
        const noteTitleInput = document.getElementById('note-title-input');
        const noteContentInput = document.getElementById('note-content-input');
        const charCountEl = document.getElementById('char-count');
        const wordCountEl = document.getElementById('word-count');
        const activeTimerDisplay = document.getElementById('active-timer-display');
        const timerStatusDot = document.getElementById('timer-status-dot');
        const totalStatsCount = document.getElementById('total-stats-count');

        // Font Controls
        const fontFamilySelect = document.getElementById('font-family-select');
        const fontSizeSelect = document.getElementById('font-size-select');

        // Export & Modal Elements
        const exportMenuBtn = document.getElementById('export-menu-btn');
        const exportDropdown = document.getElementById('export-dropdown');
        const excerptModal = document.getElementById('excerpt-modal');
        const modalExcerptText = document.getElementById('modal-excerpt-text');
        const modalAuthorInput = document.getElementById('modal-author-input');
        const modalExcerptAuthor = document.getElementById('modal-excerpt-author');
        const excerptCardPreview = document.getElementById('excerpt-card-preview');

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadStateFromLocalStorage();

            if (state.notes.length === 0) {
                createNewNote("무제_MUZE에 오신 것을 환영합니다", "이곳은 글쓰기와 발췌를 위한 아카이브 공간입니다.\n\n좌측 목차에서 새 집필 노트를 생성하거나 작성 중인 글에서 문장을 선택해 '발췌' 카드를 만들어 보세요.\n\n우측 상단의 '저장 / 내보내기' 버튼을 사용하면 글자 짤림 없는 깨끗한 A4 규격 이미지(PNG) 또는 PDF 파일로 쉽게 보관할 수 있습니다.");
            } else {
                renderNotesList();
                renderExcerptsList();
                selectNote(state.notes[0].id);
            }

            setupEventListeners();
            startWritingTimer();
        });

        // LocalStorage Logic
        function saveStateToLocalStorage() {
            localStorage.setItem('muze_pink_app_state', JSON.stringify({
                notes: state.notes,
                excerpts: state.excerpts,
                timerSeconds: state.timerSeconds
            }));
            updateStatsUI();
        }

        function loadStateFromLocalStorage() {
            const saved = localStorage.getItem('muze_pink_app_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.notes = parsed.notes || [];
                    state.excerpts = parsed.excerpts || [];
                    state.timerSeconds = parsed.timerSeconds || 0;
                } catch (e) {
                    console.error("Failed to restore state", e);
                }
            }
        }

        // Note Management
        function createNewNote(title = "제목 없는 집필 노트", content = "") {
            const newNote = {
                id: 'note_' + Date.now(),
                title: title,
                content: content,
                createdAt: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }),
                updatedAt: Date.now()
            };
            state.notes.unshift(newNote);
            saveStateToLocalStorage();
            renderNotesList();
            selectNote(newNote.id);
        }

        function selectNote(id) {
            state.activeNoteId = id;
            const note = state.notes.find(n => n.id === id);
            if (!note) return;

            noteTitleInput.value = note.title;
            noteContentInput.value = note.content;

            updateWordAndCharCount();
            renderNotesList();
        }

        function updateCurrentNote() {
            if (!state.activeNoteId) return;
            const note = state.notes.find(n => n.id === state.activeNoteId);
            if (!note) return;

            note.title = noteTitleInput.value || "제목 없는 집필 노트";
            note.content = noteContentInput.value;
            note.updatedAt = Date.now();

            saveStateToLocalStorage();
            updateWordAndCharCount();
            
            const sidebarTitleEl = document.querySelector(`[data-note-id="${note.id}"] .note-title`);
            if (sidebarTitleEl) {
                sidebarTitleEl.textContent = note.title;
            }

            triggerActivity();
        }

        function deleteNote(id, event) {
            event.stopPropagation();
            if (state.notes.length <= 1) {
                alert("최소 하나의 집필 노트는 유지되어야 합니다.");
                return;
            }
            if (confirm("이 집필 노트를 삭제하시겠습니까?")) {
                state.notes = state.notes.filter(n => n.id !== id);
                saveStateToLocalStorage();
                renderNotesList();
                if (state.activeNoteId === id) {
                    selectNote(state.notes[0].id);
                }
            }
        }

        // Excerpt Management
        function saveExcerpt(text, author, theme = "pink") {
            const newExcerpt = {
                id: 'excerpt_' + Date.now(),
                text: text,
                author: author || "무제_MUZE",
                theme: theme,
                createdAt: new Date().toLocaleDateString('ko-KR')
            };
            state.excerpts.unshift(newExcerpt);
            saveStateToLocalStorage();
            renderExcerptsList();
            closeExcerptModal();
        }

        function deleteExcerpt(id) {
            state.excerpts = state.excerpts.filter(e => e.id !== id);
            saveStateToLocalStorage();
            renderExcerptsList();
        }

        // Render Sidebar Lists
        function renderNotesList(query = '') {
            notesListContainer.innerHTML = '';
            const filtered = state.notes.filter(n => 
                n.title.toLowerCase().includes(query.toLowerCase()) || 
                n.content.toLowerCase().includes(query.toLowerCase())
            );

            filtered.forEach(note => {
                const isActive = note.id === state.activeNoteId;
                const div = document.createElement('div');
                div.setAttribute('data-note-id', note.id);
                div.className = `group p-3 rounded-xl cursor-pointer transition-all border ${
                    isActive 
                        ? 'bg-brand-50/90 border-brand-200 text-brand-900 shadow-2xs' 
                        : 'hover:bg-brand-50/30 border-transparent text-gray-700'
                }`;
                div.onclick = () => selectNote(note.id);

                div.innerHTML = `
                    <div class="flex items-start justify-between gap-2 mb-1">
                        <h4 class="note-title font-semibold text-xs truncate flex-1">${escapeHtml(note.title)}</h4>
                        <button onclick="deleteNote('${note.id}', event)" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-opacity p-0.5">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <p class="text-[11px] text-gray-400 line-clamp-2 leading-relaxed mb-1.5">${escapeHtml(note.content || '내용 없음')}</p>
                    <div class="text-[10px] text-brand-300 font-mono">${note.createdAt}</div>
                `;
                notesListContainer.appendChild(div);
            });
            lucide.createIcons();
            updateStatsUI();
        }

        function renderExcerptsList() {
            excerptsListContainer.innerHTML = '';
            if (state.excerpts.length === 0) {
                excerptsListContainer.innerHTML = `
                    <div class="text-center py-8 px-4 text-xs text-brand-300">
                        <i data-lucide="quote" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        저장된 발췌문이 없습니다.<br>글 작성 중 문장을 드래그해 만들어보세요.
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            state.excerpts.forEach(excerpt => {
                const div = document.createElement('div');
                div.className = 'p-3 rounded-xl bg-gradient-to-br from-pink-50/60 to-brand-50/40 border border-brand-100/70 relative group';
                div.innerHTML = `
                    <p class="text-xs font-batang italic text-gray-800 mb-2 leading-relaxed">"${escapeHtml(excerpt.text)}"</p>
                    <div class="flex justify-between items-center text-[10px] text-brand-600 font-medium">
                        <span>— ${escapeHtml(excerpt.author)}</span>
                        <button onclick="deleteExcerpt('${excerpt.id}')" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-opacity">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                excerptsListContainer.appendChild(div);
            });
            lucide.createIcons();
            updateStatsUI();
        }

        function updateStatsUI() {
            totalStatsCount.textContent = `노트 ${state.notes.length}개 | 발췌 ${state.excerpts.length}개`;
        }

        // Active Writing Session Timer
        function startWritingTimer() {
            setInterval(() => {
                if (state.isTimerActive) {
                    state.timerSeconds++;
                    const hours = String(Math.floor(state.timerSeconds / 3600)).padStart(2, '0');
                    const minutes = String(Math.floor((state.timerSeconds % 3600) / 60)).padStart(2, '0');
                    const seconds = String(state.timerSeconds % 60).padStart(2, '0');
                    activeTimerDisplay.textContent = `${hours}:${minutes}:${seconds}`;
                }
            }, 1000);
        }

        function triggerActivity() {
            state.isTimerActive = true;
            timerStatusDot.className = "w-2 h-2 rounded-full bg-emerald-500 ml-1 animate-pulse";
            timerStatusDot.title = "집필 중";

            clearTimeout(state.idleTimer);
            state.idleTimer = setTimeout(() => {
                state.isTimerActive = false;
                timerStatusDot.className = "w-2 h-2 rounded-full bg-gray-300 ml-1";
                timerStatusDot.title = "휴식 중";
            }, 45000);
        }

        // Stats & Selection Utility
        function updateWordAndCharCount() {
            const text = noteContentInput.value;
            charCountEl.textContent = text.length;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCountEl.textContent = words;
        }

        function handleSelection() {
            const selectedText = window.getSelection().toString().trim();
            const selectionTooltip = document.getElementById('selection-tooltip');
            
            if (selectedText.length > 3) {
                const range = window.getSelection().getRangeAt(0);
                const rect = range.getBoundingClientRect();
                
                selectionTooltip.style.left = `${rect.left + window.scrollX}px`;
                selectionTooltip.style.top = `${rect.top + window.scrollY - 38}px`;
                selectionTooltip.classList.remove('hidden');
            } else {
                selectionTooltip.classList.add('hidden');
            }
        }

        function openExcerptModalWithSelection() {
            const selectedText = window.getSelection().toString().trim() || noteContentInput.value.slice(0, 100);
            if (!selectedText) {
                alert("발췌할 문장을 선택해 주세요.");
                return;
            }
            modalExcerptText.textContent = `"${selectedText}"`;
            modalAuthorInput.value = "무제_MUZE";
            modalExcerptAuthor.textContent = "무제_MUZE";
            excerptModal.classList.remove('hidden');
            document.getElementById('selection-tooltip').classList.add('hidden');
        }

        function closeExcerptModal() {
            excerptModal.classList.add('hidden');
        }

        // Export Render Preparation Helper
        function prepareRenderContainer() {
            const currentNote = state.notes.find(n => n.id === state.activeNoteId);
            if (!currentNote) return null;

            const renderTitle = document.getElementById('render-title');
            const renderContent = document.getElementById('render-content');
            const renderDate = document.getElementById('render-date');
            const printableArea = document.getElementById('printable-a4-area');

            renderTitle.textContent = currentNote.title || "제목 없는 집필 노트";
            renderContent.textContent = currentNote.content || "내용이 없습니다.";
            renderDate.textContent = currentNote.createdAt;
            renderContent.className = `text-gray-800 text-base leading-relaxed whitespace-pre-wrap break-words ${fontFamilySelect.value}`;

            return { currentNote, printableArea };
        }

        // A4 PNG Image Export
        async function exportToA4Image() {
            exportDropdown.classList.add('hidden');
            const prep = prepareRenderContainer();
            if (!prep) return;

            try {
                const canvas = await html2canvas(prep.printableArea, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    width: 794,
                    windowWidth: 794
                });

                const link = document.createElement('a');
                link.download = `${prep.currentNote.title.replace(/[^a-zA-Z0-9가-힣]/g, '_')}_무제MUZE.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error("Image generation error:", err);
                alert("이미지 저장 중 오류가 발생했습니다.");
            }
        }

        // Direct Reliable PDF Export via html2pdf
        function exportToPDF() {
            exportDropdown.classList.add('hidden');
            const prep = prepareRenderContainer();
            if (!prep) return;

            const opt = {
                margin:       0,
                filename:     `${prep.currentNote.title.replace(/[^a-zA-Z0-9가-힣]/g, '_')}_무제.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, width: 794, windowWidth: 794 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(prep.printableArea).save();
        }

        // TXT Text Download
        function exportToTXT() {
            exportDropdown.classList.add('hidden');
            const currentNote = state.notes.find(n => n.id === state.activeNoteId);
            if (!currentNote) return;

            const textData = `제목: ${currentNote.title}\n작성일: ${currentNote.createdAt}\n출처: 무제_MUZE\n\n----------------------------------------\n\n${currentNote.content}`;
            const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${currentNote.title.replace(/[^a-zA-Z0-9가-힣]/g, '_')}_무제.txt`;
            link.click();
        }

        // Backup & Restore
        function backupToJSON() {
            exportDropdown.classList.add('hidden');
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `MUZE_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function restoreFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const restored = JSON.parse(e.target.result);
                    if (restored.notes && Array.isArray(restored.notes)) {
                        state.notes = restored.notes;
                        state.excerpts = restored.excerpts || [];
                        state.timerSeconds = restored.timerSeconds || 0;
                        saveStateToLocalStorage();
                        renderNotesList();
                        renderExcerptsList();
                        if (state.notes.length > 0) selectNote(state.notes[0].id);
                        alert("데이터가 성공적으로 복원되었습니다.");
                    }
                } catch (err) {
                    alert("올바르지 않은 백업 파일 형식입니다.");
                }
            };
            reader.readAsText(file);
        }

        // Event Listeners Setup
        function setupEventListeners() {
            noteTitleInput.addEventListener('input', updateCurrentNote);
            noteContentInput.addEventListener('input', updateCurrentNote);

            // Font options
            fontFamilySelect.addEventListener('change', (e) => {
                noteContentInput.className = `w-full flex-1 resize-none bg-transparent focus:outline-none leading-relaxed text-gray-800 ${e.target.value} ${fontSizeSelect.value} min-h-[500px]`;
            });
            fontSizeSelect.addEventListener('change', (e) => {
                noteContentInput.className = `w-full flex-1 resize-none bg-transparent focus:outline-none leading-relaxed text-gray-800 ${fontFamilySelect.value} ${e.target.value} min-h-[500px]`;
            });

            document.getElementById('new-note-btn').addEventListener('click', () => createNewNote());
            document.getElementById('search-input').addEventListener('input', (e) => renderNotesList(e.target.value));

            // Tabs
            const tabNotesBtn = document.getElementById('tab-notes-btn');
            const tabExcerptsBtn = document.getElementById('tab-excerpts-btn');

            tabNotesBtn.addEventListener('click', () => {
                state.activeTab = 'notes';
                tabNotesBtn.className = "flex-1 py-2.5 text-center text-brand-600 border-b-2 border-brand-500 font-semibold flex items-center justify-center gap-1.5";
                tabExcerptsBtn.className = "flex-1 py-2.5 text-center text-gray-400 hover:text-brand-600 border-b-2 border-transparent flex items-center justify-center gap-1.5";
                notesListContainer.classList.remove('hidden');
                excerptsListContainer.classList.add('hidden');
            });

            tabExcerptsBtn.addEventListener('click', () => {
                state.activeTab = 'excerpts';
                tabExcerptsBtn.className = "flex-1 py-2.5 text-center text-brand-600 border-b-2 border-brand-500 font-semibold flex items-center justify-center gap-1.5";
                tabNotesBtn.className = "flex-1 py-2.5 text-center text-gray-400 hover:text-brand-600 border-b-2 border-transparent flex items-center justify-center gap-1.5";
                excerptsListContainer.classList.remove('hidden');
                notesListContainer.classList.add('hidden');
            });

            // Toggle Sidebar
            const sidebar = document.getElementById('sidebar');
            document.getElementById('toggle-sidebar-btn').addEventListener('click', () => {
                sidebar.classList.toggle('-ml-72');
            });

            // Export Menu
            exportMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                exportDropdown.classList.toggle('hidden');
            });

            document.addEventListener('click', () => {
                exportDropdown.classList.add('hidden');
            });

            // Actions
            document.getElementById('export-a4-png-btn').addEventListener('click', exportToA4Image);
            document.getElementById('export-pdf-btn').addEventListener('click', exportToPDF);
            document.getElementById('export-txt-btn').addEventListener('click', exportToTXT);
            document.getElementById('backup-json-btn').addEventListener('click', backupToJSON);
            
            const restoreBtn = document.getElementById('restore-json-btn');
            const fileInput = document.getElementById('json-file-input');
            restoreBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', restoreFromJSON);

            // Selection tooltips & Excerpt modal
            document.addEventListener('mouseup', handleSelection);
            document.getElementById('selection-tooltip').addEventListener('click', openExcerptModalWithSelection);
            document.getElementById('extract-selection-btn').addEventListener('click', openExcerptModalWithSelection);
            document.getElementById('close-modal-btn').addEventListener('click', closeExcerptModal);

            modalAuthorInput.addEventListener('input', (e) => {
                modalExcerptAuthor.textContent = e.target.value || "무제_MUZE";
            });

            // Themes
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const theme = e.currentTarget.getAttribute('data-theme');
                    if (theme === 'pink') {
                        excerptCardPreview.className = "p-6 rounded-xl bg-gradient-to-br from-brand-50 to-pink-50/60 border border-brand-100/80 shadow-2xs mb-4 relative text-center min-h-[160px] flex flex-col justify-center text-gray-800";
                    } else if (theme === 'clean') {
                        excerptCardPreview.className = "p-6 rounded-xl bg-white border border-gray-200 shadow-2xs mb-4 relative text-center min-h-[160px] flex flex-col justify-center text-gray-800";
                    } else if (theme === 'dark') {
                        excerptCardPreview.className = "p-6 rounded-xl bg-gray-900 border border-gray-800 shadow-2xs mb-4 relative text-center min-h-[160px] flex flex-col justify-center text-white";
                    } else if (theme === 'warm') {
                        excerptCardPreview.className = "p-6 rounded-xl bg-amber-50/80 border border-amber-200 shadow-2xs mb-4 relative text-center min-h-[160px] flex flex-col justify-center text-amber-950";
                    }
                });
            });

            document.getElementById('save-excerpt-btn').addEventListener('click', () => {
                saveExcerpt(
                    modalExcerptText.textContent.replace(/^"|"$/g, ''),
                    modalAuthorInput.value
                );
            });

            document.getElementById('download-excerpt-card-btn').addEventListener('click', async () => {
                try {
                    const canvas = await html2canvas(excerptCardPreview, { scale: 3 });
                    const link = document.createElement('a');
                    link.download = `MUZE_Excerpt_${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (e) {
                    alert("발췌 카드 저장 실패");
                }
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
