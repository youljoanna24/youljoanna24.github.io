<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무제_MUZE - 글쓰기 & 발췌 아카이브</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosepink: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gowun+Batang&family=Gowun+Dodum&family=Maru+Buri&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Gowun Batang', serif;
            background-color: #fff5f6;
            color: #4a3e3e;
        }
        .font-batang { font-family: 'Gowun Batang', serif; }
        .font-dodum { font-family: 'Gowun Dodum', sans-serif; }
        .font-myeongjo { font-family: 'Nanum Myeongjo', serif; }
        .font-maruburi { font-family: 'Maru Buri', serif; }
        .font-pen { font-family: 'Nanum Pen Script', cursive; }
        .font-dongle { font-family: 'Dongle', sans-serif; }
        .font-noto { font-family: 'Noto Sans KR', sans-serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff0f3;
        }
        ::-webkit-scrollbar-thumb {
            background: #fca5a5;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f87171;
        }

        /* Editor content styling */
        #editorContent[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: #dda0a0;
            pointer-events: none;
            display: block;
        }

        /* Printable A4 Canvas Styling */
        .a4-page {
            width: 210mm;
            padding: 20mm;
            margin: auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.08);
            box-sizing: border-box;
            position: relative;
        }

        /* Excerpt Card Capture Box */
        .excerpt-card-box {
            width: 500px;
            padding: 40px;
            background: #fffdfd;
            border: 1px solid #fecdd3;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.05);
            position: relative;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-rose-50/50">

    <!-- App Header -->
    <header class="h-14 bg-white/80 backdrop-blur border-b border-rose-100 flex items-center justify-between px-6 z-20">
        <div class="flex items-center gap-3">
            <span class="text-rose-500 text-lg font-bold tracking-wider font-dodum">무제_MUZE</span>
            <span class="text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full font-dodum">집필 & 발췌 노트</span>
        </div>
        <div class="flex items-center gap-2">
            <!-- Timer Display -->
            <div class="flex items-center gap-2 bg-rose-50 px-3 py-1.5 rounded-full border border-rose-200 text-xs text-rose-700 mr-2">
                <i class="fa-regular fa-clock"></i>
                <span id="timerDisplay" class="font-mono font-medium">00:00:00</span>
                <button id="toggleTimerBtn" onclick="toggleTimer()" class="ml-1 text-rose-500 hover:text-rose-700">
                    <i class="fa-solid fa-pause" id="timerIcon"></i>
                </button>
            </div>
            
            <button onclick="openExportModal()" class="flex items-center gap-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs px-3.5 py-1.5 rounded-lg transition shadow-sm font-dodum">
                <i class="fa-solid fa-download"></i>
                <span>저장 / 내보내기</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white/60 border-r border-rose-100 flex flex-col flex-shrink-0">
            <div class="p-3 border-b border-rose-100 flex bg-rose-50/50">
                <button onclick="switchTab('notes')" id="tabNotesBtn" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition font-dodum bg-white text-rose-600 shadow-sm">집필 노트</button>
                <button onclick="switchTab('excerpts')" id="tabExcerptsBtn" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition font-dodum text-gray-500 hover:text-rose-600">발췌 카드</button>
            </div>
            
            <div id="notesSection" class="flex-1 flex flex-col overflow-hidden">
                <div class="p-3 border-b border-rose-100 flex justify-between items-center">
                    <span class="text-xs font-bold text-rose-800 font-dodum tracking-wider">목차</span>
                    <button onclick="createNewPage()" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 px-2.5 py-1 rounded-md transition flex items-center gap-1 font-dodum">
                        <i class="fa-solid fa-plus text-[10px]"></i> 새 노트
                    </button>
                </div>
                <div id="pagesList" class="flex-1 overflow-y-auto p-2 space-y-1">
                    <!-- Pages dynamic rendering -->
                </div>
            </div>

            <div id="excerptsSection" class="flex-1 flex flex-col overflow-hidden hidden">
                <div class="p-3 border-b border-rose-100">
                    <span class="text-xs font-bold text-rose-800 font-dodum tracking-wider">발췌 아카이브</span>
                </div>
                <div id="excerptsList" class="flex-1 overflow-y-auto p-2 space-y-2">
                    <!-- Excerpt cards list -->
                </div>
            </div>

            <div class="p-3 border-t border-rose-100 bg-white/40 text-center">
                <span class="text-[11px] text-rose-400 font-dodum">무제_MUZE</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col bg-white/30 overflow-hidden">
            
            <!-- Editor Formatting Toolbar -->
            <div class="h-12 border-b border-rose-100 bg-white/80 px-4 flex items-center justify-between gap-2 overflow-x-auto">
                <div class="flex items-center gap-1">
                    <!-- Font selector -->
                    <select id="fontSelect" onchange="changeFont(this.value)" class="text-xs border border-rose-200 rounded px-2 py-1 bg-white text-rose-900 focus:outline-none focus:border-rose-400">
                        <option value="font-batang">바탕체 (Gowun Batang)</option>
                        <option value="font-dodum">돋움체 (Gowun Dodum)</option>
                        <option value="font-myeongjo">명조체 (Nanum Myeongjo)</option>
                        <option value="font-maruburi">마루부리체 (Maru Buri)</option>
                        <option value="font-pen">손글씨 (Nanum Pen)</option>
                        <option value="font-dongle">동글체 (Dongle)</option>
                        <option value="font-noto">고딕체 (Noto Sans)</option>
                    </select>

                    <div class="h-4 w-[1px] bg-rose-200 mx-1"></div>

                    <!-- Text Styles -->
                    <button onclick="execCommand('bold')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="굵게"><i class="fa-solid fa-bold"></i></button>
                    <button onclick="execCommand('italic')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="기울임꼴"><i class="fa-solid fa-italic"></i></button>
                    <button onclick="execCommand('underline')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="밑줄"><i class="fa-solid fa-underline"></i></button>
                    <button onclick="execCommand('strikeThrough')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="취소선"><i class="fa-solid fa-strikethrough"></i></button>

                    <div class="h-4 w-[1px] bg-rose-200 mx-1"></div>

                    <!-- Alignment -->
                    <button onclick="execCommand('justifyLeft')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="왼쪽 정렬"><i class="fa-solid fa-align-left"></i></button>
                    <button onclick="execCommand('justifyCenter')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="중앙 정렬"><i class="fa-solid fa-align-center"></i></button>
                    <button onclick="execCommand('justifyRight')" class="w-7 h-7 flex items-center justify-center hover:bg-rose-100 rounded text-rose-700 text-xs" title="오른쪽 정렬"><i class="fa-solid fa-align-right"></i></button>

                    <div class="h-4 w-[1px] bg-rose-200 mx-1"></div>

                    <!-- Excerpt tool button -->
                    <button onclick="createExcerptFromSelection()" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 px-2.5 py-1 rounded transition flex items-center gap-1 font-dodum">
                        <i class="fa-solid fa-quote-left text-[10px]"></i> 선택 문장 발췌
                    </button>
                </div>

                <div class="text-xs text-rose-400 font-dodum">
                    <span id="autoSaveStatus">자동 저장됨</span>
                </div>
            </div>

            <!-- Page Workspace (A4 style editor) -->
            <div class="flex-1 overflow-y-auto p-6 md:p-10 flex justify-center">
                <div class="a4-page shadow-sm border border-rose-100 flex flex-col min-h-[297mm]" id="editorPaper">
                    <!-- Title Input -->
                    <input type="text" id="noteTitleInput" oninput="updateCurrentNoteTitle(this.value)" placeholder="제목을 입력하세요..." class="text-2xl font-bold border-b border-rose-200 pb-3 mb-6 focus:outline-none focus:border-rose-400 bg-transparent text-rose-950 font-dodum w-full">
                    
                    <!-- Editable Body -->
                    <div id="editorContent" contenteditable="true" oninput="saveCurrentNoteContent()" placeholder="이곳에 글을 자유롭게 작성해보세요..." class="flex-1 focus:outline-none text-base leading-relaxed text-gray-800 font-batang min-h-[500px]"></div>

                    <!-- Page Footer Signature -->
                    <div class="mt-12 pt-4 border-t border-rose-100 text-center text-xs text-rose-300 font-dodum">
                        무제_MUZE
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Export & Print Modal -->
    <div id="exportModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl border border-rose-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-rose-900 font-dodum">저장 및 내보내기</h3>
                <button onclick="closeExportModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <p class="text-xs text-gray-500 mb-5 font-dodum">원하는 형식으로 작성된 글을 내보내거나 보관할 수 있습니다.</p>

            <div class="space-y-2.5">
                <!-- PDF Download -->
                <button onclick="downloadPDF()" class="w-full flex items-center justify-between p-3.5 bg-rose-50 hover:bg-rose-100/80 rounded-xl transition border border-rose-200/60 group">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-rose-500 text-white flex items-center justify-center">
                            <i class="fa-solid fa-file-pdf"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-xs font-bold text-rose-950 font-dodum">A4 PDF 다운로드</div>
                            <div class="text-[11px] text-rose-500">긴 글도 페이지별로 자동 분할 저장</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-rose-400 group-hover:translate-x-1 transition"></i>
                </button>

                <!-- PNG Download -->
                <button onclick="downloadPNG()" class="w-full flex items-center justify-between p-3.5 bg-rose-50 hover:bg-rose-100/80 rounded-xl transition border border-rose-200/60 group">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-rose-400 text-white flex items-center justify-center">
                            <i class="fa-solid fa-file-image"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-xs font-bold text-rose-950 font-dodum">A4 PNG 이미지 저장</div>
                            <div class="text-[11px] text-rose-500">글자가 잘리지 않는 A4 이미지</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-rose-400 group-hover:translate-x-1 transition"></i>
                </button>

                <!-- TXT Download -->
                <button onclick="downloadTXT()" class="w-full flex items-center justify-between p-3.5 bg-rose-50 hover:bg-rose-100/80 rounded-xl transition border border-rose-200/60 group">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-rose-300 text-white flex items-center justify-center">
                            <i class="fa-solid fa-file-lines"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-xs font-bold text-rose-950 font-dodum">TXT 텍스트 파일</div>
                            <div class="text-[11px] text-rose-500">순수 텍스트 파일 저장</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-rose-400 group-hover:translate-x-1 transition"></i>
                </button>
            </div>

            <div class="mt-5 pt-4 border-t border-rose-100 flex justify-end">
                <button onclick="closeExportModal()" class="px-4 py-1.5 text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg font-dodum">닫기</button>
            </div>
        </div>
    </div>

    <!-- Hidden Container for Printable / Export PDF Capture -->
    <div id="printArea" class="hidden">
        <div id="captureTarget" class="a4-page">
            <h1 id="printTitle" class="text-2xl font-bold border-b border-rose-200 pb-3 mb-2 font-dodum text-rose-950"></h1>
            <div id="printDate" class="text-right text-xs text-rose-400 mb-6 font-dodum"></div>
            <div id="printBody" class="text-base leading-relaxed text-gray-800 font-batang whitespace-pre-wrap"></div>
            <div class="mt-16 pt-4 border-t border-rose-100 text-center text-xs text-rose-400 font-dodum">
                무제_MUZE
            </div>
        </div>
    </div>

    <!-- Hidden Container for Excerpt Card Capture -->
    <div id="excerptPrintArea" class="hidden">
        <div id="excerptCaptureTarget" class="excerpt-card-box">
            <div class="text-rose-400 text-2xl mb-3"><i class="fa-solid fa-quote-left"></i></div>
            <p id="excerptCardText" class="text-base text-gray-800 font-batang leading-relaxed mb-6 whitespace-pre-wrap"></p>
            <div class="flex justify-between items-center pt-3 border-t border-rose-100 text-xs text-rose-400 font-dodum">
                <span id="excerptCardNote"></span>
                <span>무제_MUZE</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let notes = JSON.parse(localStorage.getItem('muze_notes')) || [
            {
                id: 'default-1',
                title: '첫 번째 집필 노트',
                content: '무제_MUZE에 오신 것을 환영합니다.\n\n이곳은 글쓰기와 발췌를 위한 아카이브 공간입니다. 좌측 목차에서 새 집필 노트를 생성하거나 작성 중인 글에서 문장을 선택해 발췌해보세요.\n\n우측 상단의 "저장 / 내보내기" 버튼을 사용하면 글자 짤림 없는 깨끗한 A4 규격 이미지(PNG) 또는 PDF 파일로 쉽게 보관할 수 있습니다.',
                font: 'font-batang',
                updatedAt: new Date().toISOString()
            }
        ];
        let excerpts = JSON.parse(localStorage.getItem('muze_excerpts')) || [];
        let currentNoteId = notes[0]?.id || 'default-1';
        let timerSeconds = 0;
        let timerActive = true;
        let timerInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderPagesList();
            renderExcerptsList();
            loadCurrentNote();
            startTimer();
        });

        function switchTab(tab) {
            const notesBtn = document.getElementById('tabNotesBtn');
            const excerptsBtn = document.getElementById('tabExcerptsBtn');
            const notesSec = document.getElementById('notesSection');
            const excerptsSec = document.getElementById('excerptsSection');

            if (tab === 'notes') {
                notesBtn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg transition font-dodum bg-white text-rose-600 shadow-sm';
                excerptsBtn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg transition font-dodum text-gray-500 hover:text-rose-600';
                notesSec.classList.remove('hidden');
                excerptsSec.classList.add('hidden');
            } else {
                excerptsBtn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg transition font-dodum bg-white text-rose-600 shadow-sm';
                notesBtn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg transition font-dodum text-gray-500 hover:text-rose-600';
                excerptsSec.classList.remove('hidden');
                notesSec.classList.add('hidden');
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timerActive) {
                    timerSeconds++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function toggleTimer() {
            timerActive = !timerActive;
            const icon = document.getElementById('timerIcon');
            if (timerActive) {
                icon.className = 'fa-solid fa-pause';
            } else {
                icon.className = 'fa-solid fa-play';
            }
        }

        function updateTimerDisplay() {
            const hrs = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(timerSeconds % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;
        }

        function renderPagesList() {
            const listContainer = document.getElementById('pagesList');
            listContainer.innerHTML = '';

            notes.forEach(note => {
                const isActive = note.id === currentNoteId;
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-xs font-dodum transition ${
                    isActive ? 'bg-rose-500 text-white shadow-sm' : 'hover:bg-rose-100/60 text-rose-900'
                }`;
                item.onclick = () => selectNote(note.id);

                item.innerHTML = `
                    <div class="flex items-center gap-2 truncate flex-1 pr-2">
                        <i class="fa-regular fa-file-lines ${isActive ? 'text-white' : 'text-rose-400'}"></i>
                        <span class="truncate">${note.title || '제목 없음'}</span>
                    </div>
                    ${notes.length > 1 ? `
                        <button onclick="deleteNote(event, '${note.id}')" class="opacity-60 hover:opacity-100 px-1 text-[11px] ${isActive ? 'text-white' : 'text-rose-400 hover:text-rose-600'}">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    ` : ''}
                `;
                listContainer.appendChild(item);
            });
        }

        function renderExcerptsList() {
            const listContainer = document.getElementById('excerptsList');
            listContainer.innerHTML = '';

            if (excerpts.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-xs text-rose-300 py-6 font-dodum">저장된 발췌 카드가 없습니다.</div>`;
                return;
            }

            excerpts.forEach((exc, index) => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-white rounded-xl border border-rose-200/60 shadow-sm text-xs font-batang relative group';
                item.innerHTML = `
                    <p class="text-gray-800 mb-2 leading-relaxed">"${exc.text}"</p>
                    <div class="flex justify-between items-center text-[10px] text-rose-400 font-dodum pt-2 border-t border-rose-50">
                        <span class="truncate pr-1">${exc.noteTitle}</span>
                        <div class="flex items-center gap-1.5 flex-shrink-0">
                            <button onclick="downloadSingleExcerpt(${index})" title="카드 이미지 저장" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-2 py-0.5 rounded transition">
                                <i class="fa-solid fa-image"></i> 저장
                            </button>
                            <button onclick="deleteExcerpt(${index})" title="삭제" class="text-rose-400 hover:text-rose-600 p-0.5">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function selectNote(id) {
            currentNoteId = id;
            renderPagesList();
            loadCurrentNote();
        }

        function createNewPage() {
            const newNote = {
                id: 'note-' + Date.now(),
                title: '새 집필 노트',
                content: '',
                font: 'font-batang',
                updatedAt: new Date().toISOString()
            };
            notes.unshift(newNote);
            currentNoteId = newNote.id;
            saveNotesToStorage();
            renderPagesList();
            loadCurrentNote();
        }

        function deleteNote(e, id) {
            e.stopPropagation();
            if (notes.length <= 1) return;
            notes = notes.filter(n => n.id !== id);
            if (currentNoteId === id) {
                currentNoteId = notes[0].id;
            }
            saveNotesToStorage();
            renderPagesList();
            loadCurrentNote();
        }

        function loadCurrentNote() {
            const note = notes.find(n => n.id === currentNoteId);
            if (!note) return;

            document.getElementById('noteTitleInput').value = note.title || '';
            document.getElementById('editorContent').innerHTML = note.content || '';
            
            const fontSelect = document.getElementById('fontSelect');
            fontSelect.value = note.font || 'font-batang';
            changeFont(note.font || 'font-batang', false);
        }

        function updateCurrentNoteTitle(val) {
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                note.title = val;
                note.updatedAt = new Date().toISOString();
                saveNotesToStorage();
                renderPagesList();
            }
        }

        function saveCurrentNoteContent() {
            const note = notes.find(n => n.id === currentNoteId);
            if (note) {
                note.content = document.getElementById('editorContent').innerHTML;
                note.updatedAt = new Date().toISOString();
                saveNotesToStorage();
                
                const status = document.getElementById('autoSaveStatus');
                status.innerText = '저장 중...';
                setTimeout(() => {
                    status.innerText = '자동 저장됨';
                }, 500);
            }
        }

        function saveNotesToStorage() {
            localStorage.setItem('muze_notes', JSON.stringify(notes));
        }

        function saveExcerptsToStorage() {
            localStorage.setItem('muze_excerpts', JSON.stringify(excerpts));
        }

        function changeFont(fontClass, save = true) {
            const editor = document.getElementById('editorContent');
            editor.classList.remove('font-batang', 'font-dodum', 'font-myeongjo', 'font-maruburi', 'font-pen', 'font-dongle', 'font-noto');
            editor.classList.add(fontClass);

            if (save) {
                const note = notes.find(n => n.id === currentNoteId);
                if (note) {
                    note.font = fontClass;
                    saveNotesToStorage();
                }
            }
        }

        function execCommand(command, value = null) {
            document.execCommand(command, false, value);
            saveCurrentNoteContent();
        }

        function createExcerptFromSelection() {
            const selection = window.getSelection().toString().trim();
            if (!selection) {
                alert('본문에서 발췌할 문장을 마우스로 드래그하여 선택한 후 눌러주세요.');
                return;
            }
            const note = notes.find(n => n.id === currentNoteId);
            excerpts.unshift({
                text: selection,
                noteTitle: note ? note.title : '무제_MUZE',
                date: new Date().toLocaleDateString()
            });
            saveExcerptsToStorage();
            renderExcerptsList();
            switchTab('excerpts');
        }

        function deleteExcerpt(index) {
            excerpts.splice(index, 1);
            saveExcerptsToStorage();
            renderExcerptsList();
        }

        // Individual Excerpt PNG Download
        async function downloadSingleExcerpt(index) {
            const exc = excerpts[index];
            if (!exc) return;

            document.getElementById('excerptCardText').innerText = exc.text;
            document.getElementById('excerptCardNote').innerText = exc.noteTitle;

            const printArea = document.getElementById('excerptPrintArea');
            const target = document.getElementById('excerptCaptureTarget');

            printArea.classList.remove('hidden');

            try {
                const canvas = await html2canvas(target, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#fffdfd'
                });

                const link = document.createElement('a');
                link.download = `발췌카드_${index + 1}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('발췌 카드 저장 실패:', err);
                alert('발췌 카드 이미지 생성 중 오류가 발생했습니다.');
            } finally {
                printArea.classList.add('hidden');
            }
        }

        function openExportModal() {
            document.getElementById('exportModal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        function prepareCaptureArea() {
            const note = notes.find(n => n.id === currentNoteId);
            const title = note ? note.title : '집필 노트';
            const content = document.getElementById('editorContent').innerText;
            const dateStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });

            document.getElementById('printTitle').innerText = title || '제목 없음';
            document.getElementById('printDate').innerText = dateStr;
            document.getElementById('printBody').innerText = content;
        }

        async function downloadPNG() {
            closeExportModal();
            prepareCaptureArea();

            const printArea = document.getElementById('printArea');
            const target = document.getElementById('captureTarget');

            printArea.classList.remove('hidden');

            try {
                const canvas = await html2canvas(target, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });

                const link = document.createElement('a');
                const note = notes.find(n => n.id === currentNoteId);
                const filename = (note?.title || '무제_MUZE') + '.png';

                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('PNG 저장 실패:', err);
                alert('PNG 이미지 생성 중 오류가 발생했습니다.');
            } finally {
                printArea.classList.add('hidden');
            }
        }

        function downloadPDF() {
            closeExportModal();
            prepareCaptureArea();

            const printArea = document.getElementById('printArea');
            const target = document.getElementById('captureTarget');

            printArea.classList.remove('hidden');

            const note = notes.find(n => n.id === currentNoteId);
            const filename = (note?.title || '무제_MUZE') + '.pdf';

            const opt = {
                margin:       10,
                filename:     filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(target).save().then(() => {
                printArea.classList.add('hidden');
            }).catch(err => {
                console.error('PDF 다운로드 에러:', err);
                printArea.classList.add('hidden');
                window.print();
            });
        }

        function downloadTXT() {
            closeExportModal();
            const note = notes.find(n => n.id === currentNoteId);
            const title = note ? note.title : '제목 없음';
            const content = document.getElementById('editorContent').innerText;

            const fullText = `${title}\n\n${content}\n\n— 무제_MUZE`;
            const blob = new Blob([fullText], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${title}.txt`;
            link.click();
        }
    </script>
</body>
</html>
