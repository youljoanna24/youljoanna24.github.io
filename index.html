<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 글쓰기 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf0f3; --panel:#fffafb; --border:#f3d3dc; --text:#4a2c36; --muted:#a8808e;
  --accent:#e0678a; --accent-soft:#fbdde6;
  --editor-font:'Georgia','Noto Serif KR',serif;
  --editor-size:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-palette="beige"]{
  --bg:#faf8f4; --panel:#fff; --border:#e5e0d8; --text:#2b2620; --muted:#8a8175;
  --accent:#a3673c; --accent-soft:#f1e4d6;
}
:root[data-palette="lavender"]{
  --bg:#f4f0fb; --panel:#fcfaff; --border:#dcd2f0; --text:#35294d; --muted:#8d80a8;
  --accent:#8f6bd6; --accent-soft:#e6dcf7;
}
:root[data-palette="mint"]{
  --bg:#eef8f4; --panel:#fafffd; --border:#cfe8de; --text:#25423a; --muted:#7aa092;
  --accent:#3fa583; --accent-soft:#d8f0e6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#21171c; --panel:#2b1e24; --border:#4a3640; --text:#f6e6ec; --muted:#c4a1ae;
    --accent:#f08cab; --accent-soft:#3d2a33;
  }
}
:root[data-theme="dark"]{
  --bg:#21171c; --panel:#2b1e24; --border:#4a3640; --text:#f6e6ec; --muted:#c4a1ae;
  --accent:#f08cab; --accent-soft:#3d2a33;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Georgia','Noto Serif KR',serif;
  display:flex; height:100%;
}
#sidebar{
  width:230px; min-width:230px; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:14px 10px;
}
#brand{font-size:15px; font-weight:bold; padding:6px 8px 14px; color:var(--accent); letter-spacing:.5px;}
#newBtn{
  border:1px solid var(--accent); color:var(--accent); background:transparent;
  border-radius:8px; padding:9px; font-size:14px; cursor:pointer; margin-bottom:12px; font-family:inherit;
}
#newBtn:hover{background:var(--accent-soft);}
#searchInput{
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  border-radius:7px; padding:7px 9px; font-size:12.5px; font-family:inherit;
  outline:none; margin-bottom:10px; width:100%;
}
#searchInput:focus{border-color:var(--accent);}
#pageList{list-style:none; margin:0; padding:0; overflow-y:auto; flex:1;}
#pageList li{
  padding:10px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px;
  font-size:13.5px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:6px;
}
#pageList li:hover{background:var(--accent-soft);}
#pageList li.active{background:var(--accent-soft); color:var(--text); font-weight:bold;}
#pageList li span.title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
#pageList li button{
  background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; opacity:.6; flex-shrink:0;
}
#pageList li button:hover{opacity:1; color:#c0392b;}
#main{flex:1; display:flex; flex-direction:column; min-width:0;}
#topbar{
  padding:14px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
  position:relative;
}
#stylePanel{
  display:none; position:absolute; right:16px; top:calc(100% + 6px); z-index:20;
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:14px; width:240px; box-shadow:0 6px 20px rgba(0,0,0,.14);
  flex-direction:column; gap:10px; font-size:12.5px;
}
#stylePanel.open{display:flex;}
#stylePanel label{display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted);}
#stylePanel select{
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  border-radius:7px; padding:6px 8px; font-size:12px; font-family:inherit;
}
#stylePanel input[type=range]{width:110px; accent-color:var(--accent);}
#stylePanel .tbBtn{margin-left:0; width:100%;}
#titleInput{
  font-size:22px; font-weight:bold; border:none; background:transparent; color:var(--text);
  outline:none; width:100%; font-family:var(--editor-font);
}
#titleInput::placeholder{color:var(--muted);}
#status{font-size:12px; color:var(--muted); white-space:nowrap; margin-left:16px;}
#charCount{font-size:12px; color:var(--muted); white-space:nowrap; margin-left:10px;}
#txtBtn{
  margin-left:10px; border:1px solid var(--border); background:transparent; color:var(--text);
  border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; white-space:nowrap;
}
#txtBtn:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.tbBtn{
  margin-left:10px; border:1px solid var(--border); background:transparent; color:var(--text);
  border-radius:7px; padding:7px 10px; font-size:12.5px; cursor:pointer; font-family:inherit; white-space:nowrap;
}
.tbBtn:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
#fontControls{display:flex; align-items:center; gap:6px; margin-left:12px; flex-shrink:0;}
#fontControls select{
  border:1px solid var(--border); background:var(--panel); color:var(--text);
  border-radius:7px; padding:6px 8px; font-size:12px; cursor:pointer; font-family:inherit;
}
#fontControls select:hover{border-color:var(--accent);}
#pdfBtn{
  margin-left:12px; border:1px solid var(--border); background:transparent; color:var(--text);
  border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; white-space:nowrap;
}
#pdfBtn:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
#printArea{display:none;}
#measureBox{
  position:fixed; left:-9999px; top:0; visibility:hidden;
  white-space:pre-wrap; word-break:break-word; margin:0; padding:0; line-height:1.9;
}
@media print{
  @page{ size:A4; margin:0; }
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; left:0; width:100%;}
  .print-page{
    width:210mm; height:297mm; box-sizing:border-box;
    page-break-after:always; padding:70px 60px; position:relative; overflow:hidden;
    background-color:#fff; color:#222; background-size:cover; background-position:center;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .print-page:last-child{page-break-after:auto;}
  .print-page h1{font-size:21px; margin:0 0 28px; font-family:var(--editor-font);}
  .print-content{font-size:var(--editor-size); line-height:1.9; white-space:pre-wrap; font-family:var(--editor-font);}
  .print-footer{position:absolute; bottom:28px; left:0; right:0; text-align:center; font-size:11px; color:#888; letter-spacing:1px;}
}
#editorWrap{
  flex:1; overflow-y:auto; padding:32px 20px; display:flex; justify-content:center; align-items:flex-start;
  background-color:var(--bg); background-size:cover; background-position:center; background-repeat:no-repeat;
}
#page{
  width:100%; max-width:640px; aspect-ratio:210/297; margin:0 auto;
  background:var(--panel);
  background:color-mix(in srgb, var(--panel) var(--paper-alpha,100%), transparent);
  border:1px solid var(--border); border-radius:2px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  padding:56px 48px; position:relative; flex-shrink:0;
}
#page{background-size:cover; background-position:center; background-repeat:no-repeat;}
#fgColor{width:44px; height:28px; padding:0; border:1px solid var(--border); border-radius:6px; background:transparent; cursor:pointer;}
#timerBox{
  display:flex; align-items:center; gap:6px; margin-left:12px; cursor:pointer; user-select:none;
  font-size:12.5px; color:var(--muted); white-space:nowrap; flex-shrink:0;
}
#timerDot{width:7px; height:7px; border-radius:50%; background:var(--border);}
#timerBox.on #timerDot{background:#3fb37f; box-shadow:0 0 0 3px rgba(63,179,127,.2);}
#timerBox:hover #timerText{color:var(--accent);}
#timerBtn{
  display:none; border:1px solid var(--border); background:transparent; color:var(--text);
  border-radius:6px; width:24px; height:24px; cursor:pointer; font-size:11px; padding:0;
}
#timerBox.manual #timerBtn{display:inline-block;}
#timerPanel{
  display:none; position:absolute; right:16px; top:calc(100% + 6px); z-index:20;
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:14px; width:250px; box-shadow:0 6px 20px rgba(0,0,0,.14);
  flex-direction:column; gap:10px; font-size:12.5px;
}
#timerPanel.open{display:flex;}
#timerPanel .tRow{display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--muted);}
#timerPanel .tRow b{color:var(--text); font-weight:600;}
#timerPanel .tbBtn{margin-left:0; width:100%;}
#saveMenu{
  display:none; position:absolute; right:16px; top:calc(100% + 6px); z-index:20;
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:10px; width:250px; box-shadow:0 6px 20px rgba(0,0,0,.14);
  flex-direction:column; gap:6px;
}
#saveMenu.open{display:flex;}
#saveMenu button{
  margin:0; width:100%; text-align:left; border:1px solid var(--border); background:transparent; color:var(--text);
  border-radius:7px; padding:8px 10px; font-size:12.5px; cursor:pointer; font-family:inherit; white-space:normal;
}
#saveMenu button:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
#pageList li button.dup:hover{color:var(--accent);}
#toast{
  display:none; position:fixed; left:50%; bottom:72px; transform:translateX(-50%); z-index:50;
  background:var(--text); color:var(--panel); padding:10px 14px; border-radius:10px; font-size:13px;
  align-items:center; gap:12px; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:90vw;
}
#toast.show{display:flex;}
#toast button{background:transparent; border:none; color:var(--accent-soft); text-decoration:underline; cursor:pointer; font-size:13px; font-family:inherit; padding:0;}
#focusExit{
  display:none; position:fixed; top:12px; right:14px; z-index:40; border:1px solid var(--border);
  background:var(--panel); color:var(--muted); border-radius:20px; padding:6px 12px; font-size:12px;
  cursor:pointer; font-family:inherit; opacity:.7;
}
#focusExit:hover{opacity:1;}
body.focus #sidebar, body.focus #topbar, body.focus #pageFooter{display:none;}
body.focus #focusExit{display:block;}
.panelTitle{font-size:11.5px; color:var(--accent); font-weight:bold; margin-top:2px;}
#editor{
  width:100%; height:100%; min-height:520px; border:none; outline:none; resize:none;
  background:transparent; color:var(--text); font-size:var(--editor-size); line-height:2; font-family:var(--editor-font);
}
#editor::placeholder{color:var(--muted);}
#empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); font-size:14px; padding:0 40px;}
#pageNumOnPage{
  position:absolute; bottom:20px; left:0; right:0; text-align:center;
  font-size:13px; color:var(--muted); letter-spacing:1.5px;
  font-family:var(--editor-font);
}
#pageFooter{
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));
  font-size:13px; color:var(--muted); border-top:1px solid var(--border);
  font-family:'Georgia','Noto Serif KR',serif; letter-spacing:1px;
}
#pageFooter button{
  border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; padding:4px 6px;
}
#pageFooter button:hover{color:var(--accent);}
#pageFooter button:disabled{opacity:.25; cursor:default;}
#pageFooter button:disabled:hover{color:var(--muted);}
@media (max-width:640px){
  #sidebar{position:fixed; z-index:10; height:100%; transform:translateX(-100%); transition:transform .2s;}
  #sidebar.open{transform:translateX(0);}
  #menuBtn{display:inline-block !important;}
  #titleInput{font-size:19px;}
  #status{display:none;}
  #timerBox{margin-left:6px; font-size:11px;}
  #charCount{display:none;}
  .tbBtn{padding:6px 7px; font-size:11px; margin-left:6px;}
  #txtBtn{padding:6px 8px; font-size:11px; margin-left:6px;}
  #pdfBtn{padding:6px 8px; font-size:11px; margin-left:6px;}
  #page{padding:32px 22px;}
  #editorWrap{padding:16px 12px;}
  #fontControls{margin-left:6px; gap:4px;}
  #fontControls select{padding:5px 4px; font-size:11px;}
}
#menuBtn{display:none; border:none; background:none; font-size:20px; color:var(--text); cursor:pointer; margin-right:10px;}
</style>
</head>
<body>
<div id="sidebar">
  <div id="brand">나의 글쓰기 노트</div>
  <button id="newBtn">+ 새 페이지</button>
  <input id="searchInput" type="text" placeholder="검색..." />
  <ul id="pageList"></ul>
</div>
<div id="main">
  <div id="topbar">
    <div style="display:flex;align-items:center;flex:1;min-width:0;">
      <button id="menuBtn">☰</button>
      <input id="titleInput" placeholder="제목 없음" />
    </div>
    <div id="fontControls">
      <select id="fontSelect" title="글꼴">
        <option value="'Georgia','Noto Serif KR',serif">명조체</option>
        <option value="'Noto Sans KR',-apple-system,sans-serif">고딕체</option>
        <option value="'Gaegu',cursive">손글씨체</option>
        <option value="'Nanum Gothic Coding','Courier New',monospace">타자기체</option>
      </select>
      <select id="sizeSelect" title="글자 크기">
        <option value="14px">14</option>
        <option value="16px" selected>16</option>
        <option value="18px">18</option>
        <option value="20px">20</option>
        <option value="22px">22</option>
        <option value="24px">24</option>
      </select>
    </div>
    <div id="status">저장됨</div>
    <span id="charCount">0자</span>
    <div id="timerBox" title="작업 시간 (눌러서 자세히 보기)">
      <span id="timerDot"></span><span id="timerText">⏱ 00:00</span><button id="timerBtn" type="button" title="시작 / 일시정지">▶</button>
    </div>
    <button id="styleBtn" class="tbBtn" title="색상·배경 꾸미기">🎨</button>
    <button id="themeBtn" class="tbBtn" title="다크모드 켜기/끄기">🌙</button>
    <button id="copyBtn" class="tbBtn" title="현재 페이지 글 복사">복사</button>
    <button id="focusBtn" class="tbBtn" title="집중 모드 (Alt+F)">⛶</button>
    <button id="saveBtn" class="tbBtn" title="저장 / 백업">💾 저장</button>
    <div id="timerPanel">
      <div class="panelTitle">작업 시간</div>
      <div class="tRow"><span>오늘</span><b id="tToday">0초</b></div>
      <div class="tRow"><span>이 페이지</span><b id="tPage">0초</b></div>
      <div class="tRow"><span>전체 페이지 합계</span><b id="tTotal">0초</b></div>
      <label class="tRow"><span>자동 측정<br>(글 쓸 때만 · 1분 쉬면 멈춤)</span><input id="timerAutoChk" type="checkbox" checked></label>
      <button id="timerResetBtn" class="tbBtn" type="button">이 페이지 시간 초기화</button>
    </div>
    <div id="saveMenu">
      <button id="imgBtn">🖼 이미지로 저장 (PNG, 현재 페이지)</button>
      <button id="pdfBtn" title="현재 페이지를 PDF로 저장">📄 PDF로 저장 (현재 페이지)</button>
      <button id="txtBtn" title="TXT로 내보내기">📝 TXT로 저장 (전체)</button>
      <button id="backupBtn">💾 백업 저장 (전체, JSON)</button>
      <button id="restoreBtn">📂 백업 불러오기</button>
    </div>
    <input id="restoreFile" type="file" accept=".json,application/json" style="display:none;">
    <div id="stylePanel">
      <label>화면 색상
        <select id="paletteSelect">
          <option value="pink">핑크</option>
          <option value="lavender">라벤더</option>
          <option value="mint">민트</option>
          <option value="beige">베이지</option>
        </select>
      </label>
      <div class="panelTitle">글 디자인 (지금 보는 페이지)</div>
      <label>배경
        <select id="designSelect">
          <option value="none">없음</option>
          <option value="sky">핑크 하늘</option>
          <option value="sunset">노을</option>
          <option value="lavender">라벤더 구름</option>
          <option value="mint">민트 숨결</option>
          <option value="photo" disabled>내 사진</option>
        </select>
      </label>
      <label>글자색
        <select id="fgSelect">
          <option value="">기본</option>
          <option value="#ffffff">흰색</option>
          <option value="#2b2b2b">검정</option>
          <option value="#7a2f4d">진한 핑크</option>
          <option value="custom" disabled>직접 고른 색</option>
        </select>
      </label>
      <label>글자색 직접 고르기
        <input id="fgColor" type="color" value="#4a2c36">
      </label>
      <label>글 정렬
        <select id="alignSelect">
          <option value="left">왼쪽</option>
          <option value="center">가운데</option>
        </select>
      </label>
      <button id="bgUploadBtn" class="tbBtn">내 사진 넣기</button>
      <button id="bgClearBtn" class="tbBtn">디자인 지우기</button>
      <input id="bgFile" type="file" accept="image/*" style="display:none;">
    </div>
  </div>
  <div id="editorWrap">
    <div id="page">
      <textarea id="editor" placeholder="여기에 글을 쓰세요..."></textarea>
      <div id="empty" style="display:none;">왼쪽에서 "새 페이지"를 눌러 글쓰기를 시작하세요.</div>
      <div id="pageNumOnPage">-</div>
    </div>
  </div>
  <div id="pageFooter">
    <button id="prevBtn" title="이전 페이지">◀</button>
    <button id="nextBtn" title="다음 페이지">▶</button>
  </div>
</div>
<div id="printArea"></div>
<div id="measureBox"></div>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn" type="button"></button></div>
<button id="focusExit" type="button">✕ 집중 모드 끝내기</button>

<script>
const STORAGE_KEY = "writing-site-pages-v1";
let pages = [];
let currentId = null;
let saveTimer = null;

function loadPages(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    pages = raw ? JSON.parse(raw) : [];
  }catch(e){ pages = []; }
}
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(pages)); return true; }catch(e){ return false; }
}
function newPage(){
  const p = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), title:"", content:"", created: Date.now(), updated: Date.now() };
  pages.unshift(p);
  currentId = p.id;
  rememberLast();
  persist();
  renderList();
  renderEditor();
  document.getElementById("titleInput").focus();
}
function deletePage(id, e){
  e.stopPropagation();
  const removed = pages.find(p=>p.id===id);
  if(!removed) return;
  pages = pages.filter(p=>p.id!==id);
  if(currentId===id){ currentId = pages.length ? pages[0].id : null; }
  persist();
  renderList();
  renderEditor();
  showToast("페이지를 삭제했어요", "되돌리기", ()=>{
    pages.push(removed);
    currentId = removed.id;
    rememberLast();
    persist();
    renderList();
    renderEditor();
  }, 7000);
}
const LAST_KEY = "writing-site-last-v1";
function rememberLast(){
  try{ localStorage.setItem(LAST_KEY, currentId || ""); }catch(e){}
}
function selectPage(id){
  currentId = id;
  rememberLast();
  renderList();
  renderEditor();
  if(window.innerWidth<=640) document.getElementById("sidebar").classList.remove("open");
}
function renderList(){
  const ul = document.getElementById("pageList");
  const q = (document.getElementById("searchInput").value||"").trim().toLowerCase();
  ul.innerHTML = "";
  pages.slice().sort((a,b)=>b.updated-a.updated)
    .filter(p=> !q || (p.title||"").toLowerCase().includes(q) || (p.content||"").toLowerCase().includes(q))
    .forEach(p=>{
    const li = document.createElement("li");
    li.className = p.id===currentId ? "active":"";
    const span = document.createElement("span");
    span.className = "title";

function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function splitIntoPages(text, widthPx, firstMaxH, restMaxH, font, size){
  const measure = document.getElementById("measureBox");
  measure.style.width = widthPx + "px";
  measure.style.fontFamily = font;
  measure.style.fontSize = size;
  const pages = [];
  if(!text) return pages;
  let remaining = text;
  let first = true;
  let guard = 0;
  while(remaining.length && guard < 500){
    guard++;
    const maxH = first ? firstMaxH : restMaxH;
    measure.textContent = remaining;
    if(measure.scrollHeight <= maxH){ pages.push(remaining); break; }
    let lo=1, hi=remaining.length, best=1;
    while(lo<=hi){
      const mid=(lo+hi)>>1;
      measure.textContent = remaining.slice(0,mid);
      if(measure.scrollHeight <= maxH){ best=mid; lo=mid+1; } else { hi=mid-1; }
    }
    let cut = Math.max(best,1);
    const backLimit = Math.max(0, cut-200);
    let niceCut = -1;
    for(let i=cut;i>backLimit;i--){ if(remaining[i-1]==="\n"){ niceCut=i; break; } }
    if(niceCut===-1){ for(let i=cut;i>backLimit;i--){ if(remaining[i-1]===" "){ niceCut=i; break; } } }
    if(niceCut>0) cut=niceCut;
    pages.push(remaining.slice(0,cut));
    remaining = remaining.slice(cut);
    first = false;
  }
  return pages;
}
function exportPDF(){
  const p = pages.find(p=>p.id===currentId);
  if(!p){ alert("저장할 페이지가 없어요. 먼저 페이지를 선택하거나 만들어주세요."); return; }
  const cs = getComputedStyle(document.documentElement);
  const font = cs.getPropertyValue("--editor-font").trim();
  const size = cs.getPropertyValue("--editor-size").trim();
  const contentWidthPx = 670;
  const restMaxH = 900;
  const firstMaxH = 840;
  const area = document.getElementById("printArea");
  const title = escapeHtml(p.title || "제목 없음");
  const chunks = splitIntoPages(p.content||"", contentWidthPx, firstMaxH, restMaxH, font, size);
  let html = "";
  let pageNum = 0;
  if(chunks.length===0){
    pageNum++;
    html += '<div class="print-page"><h1>'+title+'</h1><div class="print-footer">- '+pageNum+' -</div></div>';
  } else {
    chunks.forEach((chunk, idx)=>{
      pageNum++;
      const contentHtml = escapeHtml(chunk).replace(/\n/g,"<br>");
      const titleHtml = idx===0 ? ('<h1>'+title+'</h1>') : '';
      html += '<div class="print-page">'+titleHtml+'<div class="print-content">'+contentHtml+'</div><div class="print-footer">- '+pageNum+' -</div></div>';
    });
  }
  area.innerHTML = html;
  area.querySelectorAll(".print-page").forEach(el=>{
    el.style.textAlign = p.align==="center" ? "center" : "left";
    if(p.bg) el.style.backgroundImage = p.bg;
    if(p.fg){
      el.style.color = p.fg;
      const ft = el.querySelector(".print-footer");
      if(ft) ft.style.color = p.fg;
    }
  });
  window.print();
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ alert("백업 파일을 읽을 수 없어요."); return; }
    const list = Array.isArray(data) ? data : (data && data.pages);
    if(!Array.isArray(list)){ alert("백업 파일 형식이 맞지 않아요."); return; }
    let added = 0, updated = 0;
    list.forEach(raw=>{
      if(!raw || typeof raw.id !== "string") return;
      const item = Object.assign({}, raw, {
        title: typeof raw.title === "string" ? raw.title : "",
        content: typeof raw.content === "string" ? raw.content : "",
        created: raw.created || raw.updated || Date.now(),
        updated: raw.updated || Date.now()
      });
      const idx = pages.findIndex(p=>p.id===item.id);
      if(idx<0){ pages.push(item); added++; }
      else if((item.updated||0) > (pages[idx].updated||0)){ pages[idx] = item; updated++; }
    });
    if(!currentId && pages.length) currentId = pages[0].id;
    persist();
    renderList();
    renderEditor();
    showToast("불러오기 완료: 새 페이지 " + added + "개, 갱신 " + updated + "개", null, null, 4500);
  };
  reader.readAsText(file);
}

// 이미지로 저장 (PNG)
function loadImg(src){
  return new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; });
}
function wrapText(ctx, text, maxW){
  const out = [];
  text.split("\n").forEach(par=>{
    if(par===""){ out.push(""); return; }
    let line = "", lastSpace = -1;
    for(const ch of par){
      const test = line + ch;
      if(ctx.measureText(test).width > maxW && line !== ""){
        if(lastSpace > 0){
          out.push(line.slice(0, lastSpace));
          line = line.slice(lastSpace+1) + ch;
        } else {
          out.push(line);
          line = ch;
        }
        lastSpace = line.lastIndexOf(" ");
      } else {
        line = test;
        if(ch===" ") lastSpace = line.length - 1;
      }
    }
    out.push(line);
  });
  return out;
}
function drawGradient(ctx, css, W, H){
  const m = css.match(/linear-gradient\(\s*(-?[\d.]+)deg\s*,(.*)\)$/);
  if(!m){ ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H); return; }
  const ang = parseFloat(m[1]) * Math.PI / 180;
  const len = Math.abs(W*Math.sin(ang)) + Math.abs(H*Math.cos(ang));
  const cx = W/2, cy = H/2, dx = Math.sin(ang)*len/2, dy = -Math.cos(ang)*len/2;
  const g = ctx.createLinearGradient(cx-dx, cy-dy, cx+dx, cy+dy);
  m[2].split(",").forEach(s=>{
    const parts = s.trim().split(/\s+/);
    if(parts.length>=2) g.addColorStop(parseFloat(parts[1])/100, parts[0]);
  });
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}
async function exportPNG(){
  const p = curPage();
  if(!p){ alert("저장할 페이지가 없어요. 먼저 페이지를 선택하거나 만들어주세요."); return; }
  const rootCs = getComputedStyle(document.documentElement);
  const family = rootCs.getPropertyValue("--editor-font").trim();
  const sizePx = parseFloat(rootCs.getPropertyValue("--editor-size")) || 16;
  const W = 1080, baseH = Math.round(W*297/210), k = W/640;
  const fs = sizePx*k, lh = fs*2;
  const padX = 48*k, padTop = 56*k, padBottom = 76*k;
  const fg = p.fg || getComputedStyle(document.getElementById("editor")).color;
  try{ await document.fonts.load(fs + "px " + family); await document.fonts.load("bold " + fs + "px " + family); }catch(e){}
  const tmp = document.createElement("canvas").getContext("2d");
  tmp.font = fs + "px " + family;
  const lines = wrapText(tmp, p.content||"", W - padX*2);
  const titleFs = fs*1.35, titleLH = titleFs*1.6;
  const titleBlock = p.title ? titleLH + fs*0.6 : 0;
  const H = Math.max(baseH, Math.ceil(padTop + titleBlock + lines.length*lh + padBottom));
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  // 배경
  if(p.bg && p.bg.indexOf("linear-gradient")===0){
    drawGradient(ctx, p.bg, W, H);
  } else if(p.bg && p.bg.indexOf("url(")===0){
    try{
      const img = await loadImg(p.bg.replace(/^url\("?/, "").replace(/"?\)$/, ""));
      const sc = Math.max(W/img.width, H/img.height);
      const dw = img.width*sc, dh = img.height*sc;
      ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
    }catch(e){ ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H); }
  } else {
    ctx.fillStyle = rootCs.getPropertyValue("--panel").trim() || "#ffffff";
    ctx.fillRect(0,0,W,H);
  }
  // 글
  const center = p.align==="center";
  ctx.fillStyle = fg;
  ctx.textAlign = center ? "center" : "left";
  ctx.textBaseline = "middle";
  const x = center ? W/2 : padX;
  let y = padTop;
  if(p.title){
    ctx.font = "bold " + titleFs + "px " + family;
    ctx.fillText(p.title, x, y + titleLH/2, W - padX*2);
    y += titleBlock;
  }
  ctx.font = fs + "px " + family;
  lines.forEach((ln, i)=>{ if(ln) ctx.fillText(ln, x, y + i*lh + lh/2); });
  // 페이지 번호
  const num = orderedPages().findIndex(x=>x.id===p.id) + 1;
  ctx.globalAlpha = 0.75;
  ctx.textAlign = "center";
  ctx.font = (fs*0.8) + "px " + family;
  ctx.fillText("- " + num + " -", W/2, H - 36*k);
  ctx.globalAlpha = 1;
  c.toBlob(blob=>{
    if(!blob){ alert("이미지를 만들지 못했어요."); return; }
    downloadBlob(blob, safeName(p.title) + ".png");
    showToast("이미지로 저장했어요");
  }, "image/png");
}
document.getElementById("imgBtn").onclick = exportPNG;

function toggleFocus(){ document.body.classList.toggle("focus"); }
document.getElementById("focusBtn").onclick = toggleFocus;
document.getElementById("focusExit").onclick = toggleFocus;

// 추가 단축키: Alt+F 집중 모드, Esc 닫기, Ctrl/Cmd+S 안내
document.addEventListener("keydown", (e)=>{
  if(e.altKey && !e.ctrlKey && !e.metaKey && (e.code==="KeyF")){ e.preventDefault(); toggleFocus(); }
  if(e.key==="Escape"){
    document.body.classList.remove("focus");
    PANELS.forEach(pid=>document.getElementById(pid).classList.remove("open"));
  }
  if((e.ctrlKey || e.metaKey) && (e.key==="s" || e.key==="S")){
    e.preventDefault();
    showToast("자동 저장되고 있어요. 파일로 받으려면 💾 저장 메뉴를 쓰세요.");
  }
});

// ===== 작업 시간 측정 =====
const TIMER_KEY = "writing-site-timer-v1";
const LOG_KEY = "writing-site-timelog-v1";
const IDLE_MS = 60000;
let timerAuto = true, timerRunning = false;
let lastActivity = 0, lastTick = Date.now(), lastSave = Date.now(), timerDirty = false;
let timeLog = {};
try{ const s = JSON.parse(localStorage.getItem(TIMER_KEY) || "{}"); if(s.auto === false) timerAuto = false; }catch(e){}
try{ timeLog = JSON.parse(localStorage.getItem(LOG_KEY) || "{}") || {}; }catch(e){ timeLog = {}; }
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtClock(sec){
  const s = Math.floor(sec), h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60;
  return h>0 ? h + ":" + pad2(m) + ":" + pad2(r) : pad2(m) + ":" + pad2(r);
}
function fmtKo(sec){
  const s = Math.floor(sec);
  if(s < 60) return s + "초";
  const m = Math.floor(s/60);
  if(m < 60) return m + "분";
  return Math.floor(m/60) + "시간 " + (m%60) + "분";
}
function flushTimer(){
  if(!timerDirty) return;
  persist();
  try{ localStorage.setItem(LOG_KEY, JSON.stringify(timeLog)); }catch(e){}
  timerDirty = false;
  lastSave = Date.now();
}
function updateTimerPanel(){
  const p = curPage();
  document.getElementById("tToday").textContent = fmtKo(timeLog[todayKey()] || 0);
  document.getElementById("tPage").textContent = fmtKo(p ? (p.time||0) : 0);
  document.getElementById("tTotal").textContent = fmtKo(pages.reduce((a,x)=>a+(x.time||0), 0));
}
function updateTimerUI(counting){
  const p = curPage();
  const box = document.getElementById("timerBox");
  document.getElementById("timerText").textContent = "⏱ " + fmtClock(p ? (p.time||0) : 0);
  box.classList.toggle("on", !!counting);
  box.classList.toggle("manual", !timerAuto);
  document.getElementById("timerBtn").textContent = timerRunning ? "⏸" : "▶";
  if(document.getElementById("timerPanel").classList.contains("open")) updateTimerPanel();
}
setInterval(()=>{
  const now = Date.now();
  const delta = (now - lastTick) / 1000;
  lastTick = now;
  const p = curPage();
  const counting = !!p && (timerAuto ? (now - lastActivity <= IDLE_MS) : timerRunning);
  if(counting && delta > 0 && delta <= 65){
    p.time = Math.round(((p.time||0) + delta) * 100) / 100;
    const k = todayKey();
    timeLog[k] = Math.round(((timeLog[k]||0) + delta) * 100) / 100;
    timerDirty = true;
  }
  updateTimerUI(counting);
  if(timerDirty && now - lastSave > 15000) flushTimer();
}, 1000);
function markActivity(e){
  if(e.target && (e.target.id==="editor" || e.target.id==="titleInput")) lastActivity = Date.now();
}
document.addEventListener("input", markActivity);
document.addEventListener("keydown", markActivity);
window.addEventListener("beforeunload", flushTimer);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushTimer(); });

document.getElementById("timerBox").onclick = (e)=>{
  togglePanel("timerPanel", e);
  updateTimerPanel();
};
document.getElementById("timerBtn").onclick = (e)=>{
  e.stopPropagation();
  timerRunning = !timerRunning;
  lastTick = Date.now();
  updateTimerUI(timerRunning);
};
const autoChk = document.getElementById("timerAutoChk");
autoChk.checked = timerAuto;
autoChk.onchange = ()=>{
  timerAuto = autoChk.checked;
  timerRunning = false;
  try{ localStorage.setItem(TIMER_KEY, JSON.stringify({auto:timerAuto})); }catch(e){}
  updateTimerUI(false);
};
document.getElementById("timerResetBtn").onclick = ()=>{
  const p = curPage();
  if(!p){ return; }
  if(!confirm("이 페이지의 작업 시간을 0으로 초기화할까요?")) return;
  p.time = 0;
  persist();
  updateTimerUI(false);
  updateTimerPanel();
};
updateTimerUI(false);

// 다크모드 토글 (선택값 기억)
const THEME_KEY = "writing-site-theme-v1";
function isDarkNow(){
  const t = document.documentElement.getAttribute("data-theme");
  if(t) return t==="dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function updateThemeBtn(){
  document.getElementById("themeBtn").textContent = isDarkNow() ? "☀️" : "🌙";
}
try{
  const savedTheme = localStorage.getItem(THEME_KEY);
  if(savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
}catch(e){}
document.getElementById("themeBtn").onclick = ()=>{
  const next = isDarkNow() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  updateThemeBtn();
};
updateThemeBtn();

// 현재 페이지 글 복사
document.getElementById("copyBtn").onclick = async ()=>{
  const p = pages.find(p=>p.id===currentId);
  const btn = document.getElementById("copyBtn");
  if(!p){ alert("복사할 페이지가 없어요."); return; }
  const text = (p.title ? p.title + "\n\n" : "") + (p.content||"");
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const editor = document.getElementById("editor");
    editor.focus(); editor.select(); document.execCommand("copy");
  }
  btn.textContent = "복사됨 ✓";
  setTimeout(()=>{ btn.textContent = "복사"; }, 1200);
};

// 단축키: Alt+N 새 페이지, Alt+←/→ 페이지 이동, Ctrl/Cmd+P 현재 페이지 PDF
document.addEventListener("keydown", (e)=>{
  if(e.altKey && !e.ctrlKey && !e.metaKey){
    if(e.key==="n" || e.key==="N" || e.code==="KeyN"){ e.preventDefault(); newPage(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); document.getElementById("prevBtn").click(); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); document.getElementById("nextBtn").click(); }
  }
  if((e.ctrlKey || e.metaKey) && (e.key==="p" || e.key==="P")){
    e.preventDefault();
    exportPDF();
  }
});

// Tab 키로 문단 들여쓰기 (전각 공백 2칸)
document.getElementById("editor").addEventListener("keydown", (e)=>{
  if(e.key==="Tab" && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey){
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart, en = ta.selectionEnd;
    const indent = "\u3000\u3000";
    ta.value = ta.value.slice(0,s) + indent + ta.value.slice(en);
    ta.selectionStart = ta.selectionEnd = s + indent.length;
    onEdit();
  }
});

renderEditor();

document.addEventListener("input", (e)=>{
  if(e.target.id==="titleInput" || e.target.id==="editor") onEdit();
});
</script>
