<body class="bg-rose-50 text-slate-800 font-sans h-screen flex overflow-hidden transition-colors duration-300" id="appBody">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-r border-rose-100 dark:border-slate-800 flex flex-col z-20 transition-all duration-300">
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-rose-100 dark:border-slate-800 flex items-center justify-between">
            <!-- Theme Toggle & Stats -->
            <div class="flex items-center space-x-3">
                <span id="timerDisplay" class="bg-pink-100 text-pink-700 font-mono px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold flex items-center shadow-inner">
                    <i class="fas me-1.5 fa-clock text-pink-500 animate-pulse"></i><span id="timerText">00:00:01</span>
                </span>
                <button id="themeBtn" class="p-2 rounded-lg bg-pink-100 text-pink-700 hover:bg-pink-200 transition" title="테마 변경">
                    <i class="fas fa-palette"></i>
                </button>
                <button onclick="toggleSidebar()" title="사이드바 접기" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 md:hidden transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- Search & Tab Navigation -->
        <div class="p-4 space-y-3 border-b border-rose-100 dark:border-slate-800">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="노트 검색..." oninput="filterNotes(this.value)" class="w-full pl-9 pr-4 py-2 bg-rose-50/50 dark:bg-slate-800 border border-rose-200/60 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-slate-200">
            </div>
            <div class="flex bg-rose-100/60 dark:bg-slate-800 p-1 rounded-xl text-xs font-medium">
                <button onclick="switchTab('notes')" id="tabNotesBtn" class="flex-1 py-1.5 rounded-lg bg-white dark:bg-slate-700 text-rose-800 dark:text-rose-200 shadow-sm transition">글쓰기 노트</button>
                <button onclick="switchTab('excerpts')" id="tabExcerptsBtn" class="flex-1 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 transition">발췌 보관함</button>
            </div>
        </div>

        <!-- List Area (Notes or Excerpts) -->
        <div id="notesListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2"><div class="p-3 rounded-2xl cursor-pointer transition flex items-center justify-between group bg-rose-200/70 dark:bg-slate-800 text-rose-900 dark:text-rose-200 font-semibold shadow-xs">
                    <div class="truncate flex-1 pr-2">
                        <p class="text-sm truncate">첫 번째 노트</p>
                        <p class="text-xs text-slate-400 dark:text-slate-500 truncate mt-0.5">여기에 소설, 에세이 또는 메모를 자유롭게 작성하세요.</p>
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1 transition">
                        <button onclick="event.stopPropagation(); duplicateNote('1')" title="복제" class="p-1 rounded hover:bg-white dark:hover:bg-slate-700 text-slate-500"><i class="fa-solid fa-copy text-xs"></i></button>
                        <button onclick="event.stopPropagation(); deleteNoteWithUndo('1')" title="삭제" class="p-1 rounded hover:bg-white dark:hover:bg-slate-700 text-rose-500"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                </div></div>

        <div id="excerptsListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3 hidden">
                    <div class="col-span-full text-center py-12 text-slate-400 bg-white/40 dark:bg-slate-800/40 rounded-2xl border border-dashed border-rose-200 dark:border-slate-700">
                        <i class="fas fa-quote-right text-3xl mb-2 text-rose-300 dark:text-rose-500"></i>
                        <p class="text-sm">저장된 발췌 카드가 없습니다.</p>
                    </div></div>

        <!-- Sidebar Footer / Theme Switcher -->
        <div class="p-3 border-t border-rose-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500">
        <!-- Tab Navigation -->
        <div class="flex border-b border-pink-100 bg-white/50 backdrop-blur">
            <button id="tabWrite" class="flex-1 py-3.5 px-4 font-bold text-center text-pink-600 border-b-2 border-pink-500 flex items-center justify-center gap-2 transition">
                <i class="fas fa-pen-fancy"></i> 집필 노트
            </button>
            <button id="tabExcerpts" class="flex-1 py-3.5 px-4 font-medium text-center text-slate-500 hover:text-pink-600 flex items-center justify-center gap-2 transition">
                <i class="fas fa-quote-right"></i> 발췌 카드
            </button>
            <button id="tabStats" class="flex-1 py-3.5 px-4 font-medium text-center text-slate-500 hover:text-pink-600 flex items-center justify-center gap-2 transition">
                <i class="fas fa-chart-line"></i> 통계 &amp; 백업
            </button>
        </div>
    </div></aside>

    <!-- Main Editor Area -->
    <main class="flex-1 flex flex-col h-screen relative bg-white/50 dark:bg-slate-950/50 backdrop-blur-sm overflow-hidden">
        <!-- Top Navigation / Toolbar -->
        <header class="h-14 border-b border-rose-100 dark:border-slate-800 px-4 flex items-center justify-between bg-white/80 dark:bg-slate-900/85 z-10">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-rose-100 dark:hover:bg-slate-800 transition md:hidden">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <select id="fontSelector" onchange="changeEditorFont(this.value)" class="text-xs bg-rose-50 dark:bg-slate-800 border border-rose-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-700 dark:text-slate-200 focus:outline-none">
                        <option value="font-sans">프리텐다드 (기본)</option>
                        <option value="font-batang">고운바탕 (세리프)</option>
                        <option value="font-myeongjo">나눔명조</option>
                        <option value="font-maru">마루부리</option>
                        <option value="font-dodum">고운돋움</option>
                        <option value="font-pen">나눔손글씨 펜</option>
                        <option value="font-dongle">동글 (귀여운체)</option>
                        <option value="font-gamja">감자꽃체</option>
                    </select>
                </div>
            </div>

            <!-- Formatting Tools -->
            <div class="hidden sm:flex items-center space-x-1 bg-rose-50/80 dark:bg-slate-800 p-1 rounded-xl border border-rose-200/50 dark:border-slate-700 text-xs">
                <button onclick="formatText('bold')" title="굵게" class="p-1.5 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold transition"><i class="fa-solid fa-bold"></i></button>
                <button onclick="formatText('italic')" title="기울임" class="p-1.5 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 italic transition"><i class="fa-solid fa-italic"></i></button>
                <button onclick="formatText('underline')" title="밑줄" class="p-1.5 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 underline transition"><i class="fa-solid fa-underline"></i></button>
                <button onclick="formatText('strikeThrough')" title="취소선" class="p-1.5 px-2 rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 line-through transition"><i class="fa-solid fa-strikethrough"></i></button>
                <div class="w-px h-4 bg-rose-200 dark:bg-slate-700 mx-1"></div>
                <button onclick="applyHighlight('#fde047')" title="노란 형광펜" class="w-5 h-5 rounded bg-yellow-200 border border-yellow-300 hover:scale-110 transition shadow-xs"></button>
                <button onclick="applyHighlight('#fbcfe8')" title="핑크 형광펜" class="w-5 h-5 rounded bg-pink-200 border border-pink-300 hover:scale-110 transition shadow-xs"></button>
                <button onclick="applyHighlight('#bbf7d0')" title="초록 형광펜" class="w-5 h-5 rounded bg-green-200 border border-green-300 hover:scale-110 transition shadow-xs"></button>
            </div>

            <!-- Right Top Actions -->
            <div class="flex items-center space-x-2">
                <button onclick="openExcerptModalFromSelection()" id="excerptBtn" class="hidden items-center space-x-1.5 px-3 py-1.5 bg-rose-400 hover:bg-rose-500 text-white rounded-xl text-xs font-medium shadow-sm transition">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>발췌 카드 만들기</span>
                </button>
                <button onclick="toggleFocusMode()" id="focusBtn" title="집중 모드 (Esc / Alt+F)" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-rose-100 dark:hover:bg-slate-800 transition">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </header>

        <!-- Editor Scroll Container -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6 sm:p-12 flex justify-center" id="editorScrollArea">
            <div class="w-full max-w-3xl flex flex-col space-y-4 pb-20">
                <!-- Title Input -->

                        <input type="text" id="modalSourceInput" oninput="updateCardMeta()" placeholder="예: 너라서 좋아하는 거야." class="w-full px-3 py-2 bg-rose-50/50 dark:bg-slate-800 border border-rose-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-slate-200">

                        <input type="text" id="modalAuthorInput" oninput="updateCardMeta()" placeholder="예: 무제_MUZE" value="무제_MUZE" class="w-full px-3 py-2 bg-rose-50/50 dark:bg-slate-800 border border-rose-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-slate-200">

                    <input type="text" id="modalHashtagInput" oninput="updateCardMeta()" placeholder="예: #글귀 #발췌 #사랑" value="#글귀 #발췌" class="w-full px-3 py-2 bg-rose-50/50 dark:bg-slate-800 border border-rose-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-400 dark:text-slate-200">
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center space-x-3 pt-4 border-t border-rose-100 dark:border-slate-800">
                <!-- Excerpt Add Modal Trigger -->
                <div class="flex justify-between items-center mb-6">

    <!-- Excerpt Creation Modal -->

                        저장하기

                    <button id="downloadCardBtn" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-md transition flex items-center gap-1.5">

    <!-- JavaScript Logic -->
    <script>
        // State Management
        let state = {
            documents: JSON.parse(localStorage.getItem('muze_docs')) || [
                { id: '1', title: '첫 번째 원고', content: '여기에 소설, 에세이 또는 메모를 자유롭게 작성하세요.', font: 'Inter', updatedAt: new Date().toISOString() }
            ],
            currentDocId: '1',
            excerpts: JSON.parse(localStorage.getItem('muze_excerpts')) || [],
            timerSeconds: 0,
            timerRunning: true,
            cardStyle: 'pink'
        };

        // Global Variables
        let notes = JSON.parse(localStorage.getItem('muze_notes')) || [
            { id: '1', title: '첫 번째 노트', content: '여기에 소설, 에세이 또는 메모를 자유롭게 작성하세요.', updatedAt: Date.now() }
        ];
        let activeNoteId = notes[0] ? notes[0].id : null;
        let excerpts = state.excerpts;
        let currentTheme = 'rose';
        let currentExcerptTheme = 'rose';
        let secondsElapsed = 0;
        let isIdle = false;
        let lastActivityTime = Date.now();
        let timerInterval = null;

        // DOM Elements
        const editor = document.getElementById('editorContent');
        const docTitleInput = document.getElementById('noteTitleInput');
        const excerptGrid = document.getElementById('excerptsListContainer');
        const excerptTextInput = document.getElementById('excerptTextInput');
        const excerptAuthorInput = document.getElementById('excerptAuthorInput');
        const previewText = document.getElementById('previewText');
        const previewAuthor = document.getElementById('previewAuthor');
        const excerptCardPreview = document.getElementById('excerptCardPreview');

        // Timer Functionality
        setInterval(() => {
            if (state.timerRunning) {
                state.timerSeconds++;
                const hrs = String(Math.floor(state.timerSeconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((state.timerSeconds % 3600) / 60)).padStart(2, '0');
                const secs = String(state.timerSeconds % 60).padStart(2, '0');
                const timerEl = document.getElementById('timerText');
                if (timerEl) timerEl.innerText = `${hrs}:${mins}:${secs}`;
            }
        }, 1000);

        // Render Excerpts
        function renderExcerpts() {
            const container = document.getElementById('excerptsListContainer');
            if (!container) return;
            container.innerHTML = '';
            if (state.excerpts.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 bg-white/40 dark:bg-slate-800/40 rounded-2xl border border-dashed border-rose-200 dark:border-slate-700">
                        <i class="fas fa-quote-right text-3xl mb-2 text-rose-300 dark:text-rose-500"></i>
                        <p class="text-sm">저장된 발췌 카드가 없습니다.</p>
                    </div>`;
                return;
            }

            state.excerpts.forEach((item, index) => {
                const card = document.createElement('div');
                let bgClass = "from-pink-500 to-rose-400 text-white";
                if (item.style === 'dark' || item.theme === 'dark') bgClass = "from-slate-800 to-slate-900 text-slate-100";
                if (item.style === 'warm' || item.theme === 'cream') bgClass = "from-amber-100 to-amber-200 text-amber-900";

                const authorText = (item.author && item.author.trim() !== '') ? item.author : '무제_MUZE';

                card.className = `p-4 rounded-2xl bg-gradient-to-br ${bgClass} shadow-md flex flex-col justify-between relative group min-h-[140px]`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <i class="fas fa-quote-left opacity-40 text-sm"></i>
                        <button onclick="deleteExcerpt(${index})" class="opacity-0 group-hover:opacity-100 text-xs bg-black/20 hover:bg-black/40 text-white p-1 rounded transition">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <p class="text-xs sm:text-sm my-2 italic leading-relaxed break-keep font-serif">"${escapeHtml(item.text)}"</p>
                    <div class="text-right text-xs opacity-90 border-t border-current/20 pt-1.5 font-medium">
                        ${escapeHtml(authorText)}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Excerpt Input Modal Dynamic Handlers
        if (excerptTextInput) excerptTextInput.addEventListener('input', updateCardPreview);
        if (excerptAuthorInput) excerptAuthorInput.addEventListener('input', updateCardPreview);

        function updateCardPreview() {
            const textVal = excerptTextInput ? excerptTextInput.value.trim() : '';
            const authorVal = excerptAuthorInput ? excerptAuthorInput.value.trim() : '';
            
            if (previewText) previewText.innerText = textVal ? `"${textVal}"` : '"간직하고 싶은 문장을 입력하세요..."';
            if (previewAuthor) previewAuthor.innerText = authorVal !== '' ? authorVal : '무제_MUZE';
        }

        function deleteExcerpt(index) {
            state.excerpts.splice(index, 1);
            localStorage.setItem('muze_excerpts', JSON.stringify(state.excerpts));
            renderExcerpts();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize App
        window.onload = function() {
            renderNotesList();
            if (activeNoteId) loadActiveNote();
            renderExcerpts();
            updateCardPreview();
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                if (!isIdle) {
                    secondsElapsed++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function setupIdleDetection() {
            const checkIdle = () => {
                if (Date.now() - lastActivityTime > 45000) {
                    if (!isIdle) {
                        isIdle = true;
                        document.getElementById('timerPulse').className = 'w-2 h-2 rounded-full bg-amber-400';
                        const idleTxt = document.getElementById('idleStatusText');
                        if (idleTxt) idleTxt.innerText = '○ 휴식 중 (45초 비활성)';
                    }
                }
            };
            setInterval(checkIdle, 5000);

            window.addEventListener('mousemove', resetIdle);
            window.addEventListener('keydown', resetIdle);
        }

        function resetIdle() {
            lastActivityTime = Date.now();
            if (isIdle) {
                isIdle = false;
                document.getElementById('timerPulse').className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
                const idleTxt = document.getElementById('idleStatusText');
                if (idleTxt) idleTxt.innerText = '● 글쓰기 활성 상태';
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            const timeStr = `${mins}:${secs}`;
            document.getElementById('timerDisplay').innerText = timeStr;
            const statsDisp = document.getElementById('statsTimerDisplay');
            if (statsDisp) statsDisp.innerText = timeStr;
        }

        // Theme Switcher
        function setTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('muze_theme', theme);
            const body = document.getElementById('appBody');
            body.className = 'font-sans h-screen flex overflow-hidden transition-colors duration-300';
            
            if (theme === 'rose') {
                body.classList.add('bg-rose-50', 'text-slate-800');
            } else if (theme === 'cream') {
                body.classList.add('bg-amber-50', 'text-stone-800');
            } else if (theme === 'forest') {
                body.classList.add('bg-emerald-950', 'text-emerald-100', 'dark');
            } else if (theme === 'lavender') {
                body.classList.add('bg-indigo-50', 'text-slate-800');
            } else if (theme === 'dark') {
                body.classList.add('bg-slate-900', 'text-slate-100', 'dark');
            }
        }

        // Notes Management
        function saveNotesToStorage() {
            localStorage.setItem('muze_notes', JSON.stringify(notes));
            showSaveStatus();
        }

        function showSaveStatus() {
            const status = document.getElementById('saveStatus');
            status.innerText = '저장됨 ✓';
            setTimeout(() => { status.innerText = ''; }, 2000);
        }

        function createNewNote() {
            const newNote = {
                id: Date.now().toString(),
                title: '새로운 무제 노트',
                content: '',
                updatedAt: Date.now()
            };
            notes.unshift(newNote);
            activeNoteId = newNote.id;
            saveNotesToStorage();
            renderNotesList();
            loadActiveNote();
        }

        function renderNotesList() {
            const container = document.getElementById('notesListContainer');
            container.innerHTML = '';
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = notes.filter(n => n.title.toLowerCase().includes(searchTerm) || n.content.toLowerCase().includes(searchTerm));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">검색된 노트가 없습니다.</div>`;
                return;
            }

            filtered.forEach(note => {
                const isActive = note.id === activeNoteId;
                const div = document.createElement('div');
                div.className = `p-3 rounded-2xl cursor-pointer transition flex items-center justify-between group ${isActive ? 'bg-rose-200/70 dark:bg-slate-800 text-rose-900 dark:text-rose-200 font-semibold shadow-xs' : 'hover:bg-rose-100/50 dark:hover:bg-slate-800/50 text-slate-600 dark:text-slate-300'}`;
                div.onclick = () => selectNote(note.id);
                
                div.innerHTML = `
                    <div class="truncate flex-1 pr-2">
                        <p class="text-sm truncate">${note.title || '제목 없음'}</p>
                        <p class="text-xs text-slate-400 dark:text-slate-500 truncate mt-0.5">${note.content.replace(/<[^>]*>?/gm, '') || '내용이 없습니다...'}</p>
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1 transition">
                        <button onclick="event.stopPropagation(); duplicateNote('${note.id}')" title="복제" class="p-1 rounded hover:bg-white dark:hover:bg-slate-700 text-slate-500"><i class="fa-solid fa-copy text-xs"></i></button>
                        <button onclick="event.stopPropagation(); deleteNoteWithUndo('${note.id}')" title="삭제" class="p-1 rounded hover:bg-white dark:hover:bg-slate-700 text-rose-500"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function selectNote(id) {
            activeNoteId = id;
            loadActiveNote();
            renderNotesList();
        }

        function loadActiveNote() {
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;
            document.getElementById('noteTitleInput').value = note.title;
            document.getElementById('editorContent').innerHTML = note.content;
            updateStats();
        }

        function updateActiveNoteTitle(val) {
            const note = notes.find(n => n.id === activeNoteId);
            if (note) {
                note.title = val;
                note.updatedAt = Date.now();
                saveNotesToStorage();
                renderNotesList();
            }
        }

        function handleEditorInput() {
            const content = document.getElementById('editorContent').innerHTML;
            const note = notes.find(n => n.id === activeNoteId);
            if (note) {
                note.content = content;
                note.updatedAt = Date.now();
                saveNotesToStorage();
                updateStats();
            }
        }

        function updateStats() {
            const text = document.getElementById('editorContent').innerText || '';
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;

            document.getElementById('wordCount').innerText = `단어 ${words}개`;
            document.getElementById('charCount').innerText = `글자 ${chars}자 (공백포함)`;
            
            const statsW = document.getElementById('statsWordCount');
            const statsC = document.getElementById('statsCharCount');
            if (statsW) statsW.innerText = `${words}개`;
            if (statsC) statsC.innerText = `${chars}자`;
        }

        function duplicateNote(id) {
            const target = notes.find(n => n.id === id);
            if (!target) return;
            const dup = {
                id: Date.now().toString(),
                title: `${target.title} (사본)`,
                content: target.content,
                updatedAt: Date.now()
            };
            notes.unshift(dup);
            saveNotesToStorage();
            renderNotesList();
        }

        let deletedNotesBackup = [];
        function deleteNoteWithUndo(id) {
            const idx = notes.findIndex(n => n.id === id);
            if (idx === -1) return;
            const removed = notes.splice(idx, 1)[0];
            deletedNotesBackup = { note: removed, index: idx };
            
            if (activeNoteId === id) {
                activeNoteId = notes[0] ? notes[0].id : null;
                if (activeNoteId) loadActiveNote();
                else {
                    document.getElementById('noteTitleInput').value = '';
                    document.getElementById('editorContent').innerHTML = '';
                }
            }
            saveNotesToStorage();
            renderNotesList();
            showUndoToast('노트가 삭제되었습니다.');
        }

        function showUndoToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto bg-slate-900 text-white dark:bg-rose-100 dark:text-rose-900 px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between space-x-4 text-xs font-medium animate-bounce-short';
            toast.innerHTML = `
                <span>${msg}</span>
                <button onclick="undoDelete()" class="underline font-bold text-rose-400 dark:text-rose-600">되돌리기 (7초)</button>
            `;
            container.appendChild(toast);

            const timer = setTimeout(() => {
                toast.remove();
                deletedNotesBackup = null;
            }, 7000);
            toast.dataset.timerId = timer;
        }

        function undoDelete() {
            if (!deletedNotesBackup) return;
            notes.splice(deletedNotesBackup.index, 0, deletedNotesBackup.note);
            activeNoteId = deletedNotesBackup.note.id;
            deletedNotesBackup = null;
            saveNotesToStorage();
            renderNotesList();
            loadActiveNote();
            document.getElementById('toastContainer').innerHTML = '';
        }

        // Tab Switching
        function switchTab(tab) {
            currentTab = tab;
            const btnNotes = document.getElementById('tabNotesBtn');
            const btnExcerpts = document.getElementById('tabExcerptsBtn');
            const listNotes = document.getElementById('notesListContainer');
            const listExcerpts = document.getElementById('excerptsListContainer');

            if (tab === 'notes') {
                btnNotes.className = 'flex-1 py-1.5 rounded-lg bg-white dark:bg-slate-700 text-rose-800 dark:text-rose-200 shadow-sm transition';
                btnExcerpts.className = 'flex-1 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 transition';
                listNotes.classList.remove('hidden');
                listExcerpts.classList.add('hidden');
            } else {
                btnExcerpts.className = 'flex-1 py-1.5 rounded-lg bg-white dark:bg-slate-700 text-rose-800 dark:text-rose-200 shadow-sm transition';
                btnNotes.className = 'flex-1 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 transition';
                listExcerpts.classList.remove('hidden');
                listNotes.classList.add('hidden');
                renderExcerptsGallery();
            }
        }

        // Rich Text Formatting
        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('editorContent').focus();
        }

        function applyHighlight(color) {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.style.backgroundColor = color;
            span.appendChild(range.extractContents());
            range.insertNode(span);
            handleEditorInput();
        }

        function changeEditorFont(fontClass) {
            const editor = document.getElementById('editorContent');
            editor.className = `flex-1 min-h-[500px] bg-transparent outline-none text-slate-700 dark:text-slate-200 leading-relaxed text-base sm:text-lg ${fontClass}`;
        }

        // Selection & Excerpt Card Feature
        let selectedExcerptText = '';

        function checkSelection() {
            const selection = window.getSelection();
            const text = selection.toString().trim();
            const btn = document.getElementById('excerptBtn');
            const floatBtn = document.getElementById('floatingExcerptBtn');

            if (text.length > 0) {
                selectedExcerptText = text;
                btn.classList.remove('hidden');
                btn.classList.add('flex');
                
                try {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    if (rect.top > 100) {
                        floatBtn.style.top = `${rect.top - 50}px`;
                        floatBtn.style.left = `${Math.min(window.innerWidth - 200, Math.max(20, rect.left))}px`;
                        floatBtn.classList.remove('hidden');
                    }
                } catch (e) {
                    floatBtn.classList.add('hidden');
                }
            } else {
                floatBtn.classList.add('hidden');
                if (!selectedExcerptText) {
                    btn.classList.add('hidden');
                    btn.classList.remove('flex');
                }
            }
        }

        function openExcerptModalFromSelection() {
            const text = selectedExcerptText || window.getSelection().toString().trim() || document.getElementById('editorContent').innerText.slice(0, 150);
            if (!text) {
                alertCustom('발췌할 텍스트를 선택하거나 작성해주세요.');
                return;
            }
            selectedExcerptText = text;
            document.getElementById('previewText').innerText = text;
            
            const activeNote = notes.find(n => n.id === activeNoteId);
            if (activeNote) {
                document.getElementById('modalSourceInput').value = activeNote.title || '출처 미상';
            }
            updateCardMeta();
            document.getElementById('excerptModal').classList.remove('hidden');
            document.getElementById('floatingExcerptBtn').classList.add('hidden');
        }

        function closeExcerptModal() {
            document.getElementById('excerptModal').classList.add('hidden');
        }

        function setExcerptTheme(theme) {
            currentExcerptTheme = theme;
            const card = document.getElementById('excerptCardPreview');
            if (theme === 'rose') {
                card.style.background = 'linear-gradient(135deg, #ffe4e6 0%, #fbcfe8 100%)';
                card.className = 'w-full max-w-sm rounded-2xl p-6 shadow-lg transition-all duration-300 flex flex-col justify-between min-h-[320px] text-slate-800';
            } else if (theme === 'cream') {
                card.style.background = 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)';
                card.className = 'w-full max-w-sm rounded-2xl p-6 shadow-lg transition-all duration-300 flex flex-col justify-between min-h-[320px] text-stone-800';
            } else if (theme === 'forest') {
                card.style.background = 'linear-gradient(135deg, #065f46 0%, #047857 100%)';
                card.className = 'w-full max-w-sm rounded-2xl p-6 shadow-lg transition-all duration-300 flex flex-col justify-between min-h-[320px] text-emerald-50';
            } else if (theme === 'lavender') {
                card.style.background = 'linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%)';
                card.className = 'w-full max-w-sm rounded-2xl p-6 shadow-lg transition-all duration-300 flex flex-col justify-between min-h-[320px] text-indigo-950';
            } else if (theme === 'sunset') {
                card.style.background = 'linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%)';
                card.className = 'w-full max-w-sm rounded-2xl p-6 shadow-lg transition-all duration-300 flex flex-col justify-between min-h-[320px] text-orange-950';
            } else if (theme === 'dark') {
                card.style.background = 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)';
                card.className = 'w-full max-w-sm rounded-2xl p-6 shadow-lg transition-all duration-300 flex flex-col justify-between min-h-[320px] text-slate-100';
            }
        }

        function updateCardMeta() {
            const source = document.getElementById('modalSourceInput').value || '출처 / 책 제목';
            const author = document.getElementById('modalAuthorInput').value || '작가명';
            const hashtags = document.getElementById('modalHashtagInput').value || '#글귀 #발췌';

            document.getElementById('previewSource').innerText = source;
            document.getElementById('previewAuthor').innerText = author;
            document.getElementById('previewHashtags').innerText = hashtags;
        }

        function saveExcerptToGallery() {
            const excerptObj = {
                id: Date.now().toString(),
                text: selectedExcerptText,
                source: document.getElementById('modalSourceInput').value || '출처 미상',
                author: document.getElementById('modalAuthorInput').value || '작가명',
                hashtags: document.getElementById('modalHashtagInput').value || '#글귀',
                theme: currentExcerptTheme,
                createdAt: Date.now()
            };
            excerpts.unshift(excerptObj);
            localStorage.setItem('muze_excerpts', JSON.stringify(excerpts));
            closeExcerptModal();
            showUndoToast('발췌 보관함에 저장되었습니다 📥');
        }

        function renderExcerptsGallery() {
            const container = document.getElementById('excerptsListContainer');
            container.innerHTML = '';

            if (excerpts.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">보관된 발췌 카드가 없습니다.</div>`;
                return;
            }

            excerpts.forEach(item => {
                const div = document.createElement('div');
                div.className = 'p-3 rounded-2xl bg-rose-50/50 dark:bg-slate-800 border border-rose-100 dark:border-slate-700 space-y-2 text-xs';
                div.innerHTML = `
                    <p class="font-serif italic text-slate-700 dark:text-slate-200 line-clamp-3">“${item.text}”</p>
                    <div class="flex items-center justify-between text-slate-500 pt-2 border-t border-rose-100/60 dark:border-slate-700">
                        <span class="font-semibold">${item.source} (${item.author})</span>
                        <button onclick="deleteExcerpt('${item.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function deleteExcerpt(id) {
            excerpts = excerpts.filter(e => e.id !== id);
            localStorage.setItem('muze_excerpts', JSON.stringify(excerpts));
            renderExcerptsGallery();
        }

        function downloadExcerptPng() {
            const cardEl = document.getElementById('excerptCardPreview');
            html2canvas(cardEl, { scale: 2, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = `MUZE_Excerpt_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Stats Modal
        function openStatsModal() {
            document.getElementById('statsModal').classList.remove('hidden');
            updateStats();
        }
        function closeStatsModal() {
            document.getElementById('statsModal').classList.add('hidden');
        }

        // Focus Mode
        let isFocusMode = false;
        function toggleFocusMode() {
            isFocusMode = !isFocusMode;
            const sidebar = document.getElementById('sidebar');
            const focusBtn = document.getElementById('focusBtn');
            if (isFocusMode) {
                sidebar.classList.add('-translate-x-full');
                focusBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
            } else {
                sidebar.classList.remove('-translate-x-full');
                focusBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
            }
        }

        function alertCustom(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto bg-rose-500 text-white px-4 py-3 rounded-2xl shadow-xl text-xs font-medium';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function filterNotes(query) {
            renderNotesList();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeExcerptModal();
                closeStatsModal();
                if (isFocusMode) toggleFocusMode();
            }
            if (e.altKey && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                toggleFocusMode();
            }
        });
    </script>
