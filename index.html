<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무제_MUZE - 글쓰기 & 발췌 아카이브</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosepink: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gowun+Batang&family=Gowun+Dodum&family=Maru+Buri&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Gowun Batang', serif;
            background-color: #fff5f6;
            color: #4a3e3e;
        }
        .font-batang { font-family: 'Gowun Batang', serif; }
        .font-dodum { font-family: 'Gowun Dodum', sans-serif; }
        .font-myeongjo { font-family: 'Nanum Myeongjo', serif; }
        .font-maruburi { font-family: 'Maru Buri', serif; }
        .font-pen { font-family: 'Nanum Pen Script', cursive; }
        .font-dongle { font-family: 'Dongle', sans-serif; }
        .font-noto { font-family: 'Noto Sans KR', sans-serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff0f3;
        }
        ::-webkit-scrollbar-thumb {
            background: #fca5a5;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f87171;
        }

        /* Editor content styling */
        #editorContent[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: #dda0a0;
            pointer-events: none;
            display: block;
        }

        /* Printable A4 Canvas Styling (Dynamic Height for Multi-page PDF) */
        .a4-page {
            width: 210mm;
            padding: 20mm;
            margin: auto;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.08);
            box-sizing: border-box;
            position: relative;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-rose-50/50">

    <!-- App Header -->
    <header class="h-14 bg-white/80 backdrop-blur border-b border-rose-100 flex items-center justify-between px-6 z-20">
        <div class="flex items-center gap-3">
            <span class="text-rose-500 text-lg font-bold tracking-wider font-dodum">무제_MUZE</span>
            <span class="text-xs bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full font-dodum">집필 & 발췌 노트</span>
        </div>
        <div class="flex items-center gap-2">
            <!-- Timer Display -->
            <div class="flex items-center gap-2 bg-rose-50 px-3 py-1.5 rounded-full border border-rose-200 text-xs text-rose-700 mr-2">
                <i class="fa-regular fa-clock"></i>
                <span id="timerDisplay" class="font-mono font-medium">00:00:
